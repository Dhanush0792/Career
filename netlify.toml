[build]
  publish = "frontend"
  command = "echo 'No build step required for this static site.'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[context.production.environment]
  NODE_ENV = "production"
