<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobXApply</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 330px;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #0b1020;
        color: #f4f7ff;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo-img {
        width: 24px; height: 24px;
        border-radius: 6px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .header-title { font-weight: 700; font-size: 13px; letter-spacing: 0.02em; }
      .header-sub { font-size: 10px; color: rgba(244,247,255,0.45); }

      /* Tab Navigation */
      .nav-tabs {
        display: flex;
        background: rgba(255,255,255,0.03);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 4px 12px 0;
        gap: 4px;
      }
      .nav-tab {
        flex: 1;
        padding: 8px 4px;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: rgba(244,247,255,0.55);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s ease;
      }
      .nav-tab:hover { color: #f4f7ff; }
      .nav-tab.active {
        color: #5b4fe8;
        border-bottom-color: #5b4fe8;
      }

      .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

      /* Cards & Containers */
      .card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 10px 12px;
      }

      .portal-card {
        display: flex; align-items: center; gap: 10px;
      }
      .portal-dot { width: 8px; height: 8px; border-radius: 50%; background: #2fddc4; flex-shrink: 0; }
      .portal-dot.unknown { background: rgba(255,255,255,0.25); }
      .portal-name { font-size: 12px; font-weight: 600; }
      .portal-tier { font-size: 10px; color: rgba(244,247,255,0.5); margin-top: 1px; }

      /* Profile connected card */
      .profile-card {
        display: flex; align-items: center; gap: 10px;
        background: rgba(91,79,232,0.08);
        border: 1px solid rgba(91,79,232,0.22);
      }
      .profile-avatar {
        width: 32px; height: 32px; border-radius: 50%;
        background: linear-gradient(135deg, #5b4fe8, #2fddc4);
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 700; flex-shrink: 0; color: white;
      }
      .profile-info { flex: 1; min-width: 0; }
      .profile-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f4f7ff; }
      .profile-email { font-size: 10px; color: rgba(244,247,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Form inputs */
      .input-group { display: flex; flex-direction: column; gap: 5px; }
      .input-label { font-size: 10px; font-weight: 700; color: rgba(244,247,255,0.65); text-transform: uppercase; letter-spacing: 0.05em; }
      .input-field {
        width: 100%;
        background: rgba(7,10,24,0.75);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        color: #fff;
        outline: none;
        transition: border-color 0.2s;
      }
      .input-field:focus { border-color: #5b4fe8; }
      .input-field::placeholder { color: rgba(244,247,255,0.3); }

      /* Buttons */
      .btn-primary {
        width: 100%; padding: 10px;
        background: #5b4fe8;
        border: none; border-radius: 8px; color: white;
        font-size: 12px; font-weight: 700; cursor: pointer;
        letter-spacing: 0.02em; transition: background 0.15s, opacity 0.15s;
        display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .btn-primary:hover { background: #6c61ee; }
      .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

      .btn-success {
        width: 100%; padding: 9px;
        background: rgba(47,221,196,0.12);
        border: 1px solid rgba(47,221,196,0.35);
        border-radius: 8px; color: #2fddc4;
        font-size: 11px; font-weight: 700; cursor: pointer;
        transition: background 0.15s;
        text-align: center;
      }
      .btn-success:hover { background: rgba(47,221,196,0.22); }

      .btn-google {
        width: 100%; padding: 10px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px; color: #f4f7ff;
        font-size: 12px; font-weight: 600; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: background 0.15s, border-color 0.15s;
      }
      .btn-google:hover {
        background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.3);
      }

      .btn-secondary {
        flex: 1; padding: 7px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px; color: rgba(244,247,255,0.8);
        font-size: 11px; font-weight: 600; cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
        text-align: center;
      }
      .btn-secondary:hover { border-color: rgba(91,79,232,0.6); color: #f4f7ff; }

      .btn-danger-link {
        background: none; border: none; color: rgba(235,87,87,0.75);
        font-size: 10px; cursor: pointer; text-decoration: underline;
        padding: 4px 0; text-align: center; display: block; margin: 0 auto;
      }
      .btn-danger-link:hover { color: #ff7878; }

      .btn-row { display: flex; gap: 8px; }
      .status { font-size: 11px; color: rgba(244,247,255,0.55); text-align: center; min-height: 16px; line-height: 1.4; word-break: break-word; }
      .status.success { color: #2fddc4; }
      .status.error { color: #e8547b; }
      .status.warn { color: #ff9800; }

      .divider {
        display: flex; align-items: center; text-align: center;
        color: rgba(244,247,255,0.3); font-size: 10px; text-transform: uppercase;
        margin: 2px 0;
      }
      .divider::before, .divider::after {
        content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .divider:not(:empty)::before { margin-right: 8px; }
      .divider:not(:empty)::after { margin-left: 8px; }

      /* Snippets items list */
      .snippet-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
      .snippet-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: background 0.15s, border-color 0.15s;
      }
      .snippet-item:hover {
        background: rgba(91,79,232,0.1);
        border-color: rgba(91,79,232,0.3);
      }
      .snippet-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .snippet-title { font-size: 11px; font-weight: 600; color: #f4f7ff; }
      .snippet-action { font-size: 9px; color: rgba(244,247,255,0.4); text-transform: uppercase; }
      .snippet-val {
        font-size: 10px;
        color: rgba(244,247,255,0.55);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="icon.png" class="logo-img" alt="Logo">
        <div>
          <div class="header-title">JobXApply</div>
          <div class="header-sub">Career Productivity Engine</div>
        </div>
      </div>
    </div>

    <!-- TAB NAVIGATION (Visible when logged in) -->
    <div class="nav-tabs" id="navTabs" style="display:none;">
      <button class="nav-tab active" data-tab="autofillTab">Autofill</button>
      <button class="nav-tab" data-tab="snippetsTab">Snippets</button>
      <button class="nav-tab" data-tab="trackerTab">Tracker</button>
    </div>

    <div class="body">
      <!-- VIEW 1: AUTHENTICATION / LOGIN VIEW -->
      <div id="loginView" style="display:none; flex-direction:column; gap:12px;">
        <div style="text-align:center; padding: 4px 0;">
          <div style="font-size:13px; font-weight:700; color:#f4f7ff;">Sign in to JobXApply</div>
          <div style="font-size:11px; color:rgba(244,247,255,0.5); margin-top:2px;">Sync your decrypted profile for 1-click autofill</div>
        </div>

        <button class="btn-google" id="loginGoogleBtn">
          <svg width="14" height="14" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Continue with Google
        </button>

        <div class="divider">OR USE SYNC KEY</div>

        <div class="card" style="display:flex; flex-direction:column; gap:10px; background:rgba(255,255,255,0.03);">
          <div class="input-group">
            <label class="input-label" for="loginPasscodeInput">Sync Key (Passcode)</label>
            <input type="password" id="loginPasscodeInput" class="input-field" placeholder="Enter your Vault Sync Key">
          </div>
          <button class="btn-primary" id="loginPasscodeBtn">Login &amp; Sync Profile</button>
        </div>

        <div class="status" id="loginStatus">Enter your Sync Key or sign in via Google</div>
      </div>

      <!-- VIEW 2: AUTHENTICATED TABS VIEW -->
      <div id="autofillView" style="display:none; flex-direction:column; gap:12px;">
        
        <!-- TAB CONTENT 1: AUTOFILL TAB -->
        <div id="autofillTab" class="tab-pane" style="display:flex; flex-direction:column; gap:10px;">
          <!-- Persona Selector -->
          <div class="input-group" id="personaGroup" style="display:none;">
            <label class="input-label" for="personaSelect">Active Role Persona</label>
            <select id="personaSelect" class="input-field" style="background:#0e1328; cursor:pointer; font-weight:600;"></select>
          </div>

          <div class="card portal-card">
            <div class="portal-dot" id="portalDot"></div>
            <div>
              <div class="portal-name" id="portalName">Detecting portal...</div>
              <div class="portal-tier" id="portalTier"></div>
            </div>
          </div>

          <div class="card profile-card">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <div class="profile-info">
              <div class="profile-name" id="profileName">Loading profile...</div>
              <div class="profile-email" id="profileEmail">Syncing...</div>
            </div>
          </div>

          <button class="btn-primary" id="apply">Apply Autofill</button>
          
          <button class="btn-success" id="quickLogBtn">Log Application to Tracker</button>

          <div class="btn-row">
            <button class="btn-secondary" id="editProfile">Edit Profile</button>
            <button class="btn-secondary" id="syncCloud">Sync Now</button>
          </div>
        </div>

        <!-- TAB CONTENT 2: SNIPPETS TAB -->
        <div id="snippetsTab" class="tab-pane" style="display:none; flex-direction:column; gap:10px;">
          <div style="font-size:11px; color:rgba(244,247,255,0.6);">Click any item to copy and paste into focused field:</div>
          <div class="snippet-list" id="snippetList">
            <!-- Dynamically populated from active profile -->
          </div>
        </div>

        <!-- TAB CONTENT 3: TRACKER QUICK-LOG TAB -->
        <div id="trackerTab" class="tab-pane" style="display:none; flex-direction:column; gap:10px;">
          <div class="card" style="display:flex; flex-direction:column; gap:8px;">
            <div class="input-group">
              <label class="input-label" for="trackerCompanyInput">Company Name</label>
              <input type="text" id="trackerCompanyInput" class="input-field" placeholder="e.g. Stripe">
            </div>
            <div class="input-group">
              <label class="input-label" for="trackerRoleInput">Job Title</label>
              <input type="text" id="trackerRoleInput" class="input-field" placeholder="e.g. Frontend Engineer">
            </div>
            <div class="input-group">
              <label class="input-label" for="trackerStatusSelect">Application Status</label>
              <select id="trackerStatusSelect" class="input-field" style="background:#0e1328; cursor:pointer;">
                <option value="Applied">Applied</option>
                <option value="Screening">Screening</option>
                <option value="Interview">Interview</option>
                <option value="Offer">Offer</option>
              </select>
            </div>
            <button class="btn-primary" id="manualLogBtn">Save Application</button>
          </div>
          <button class="btn-secondary" id="openTrackerBtn" style="width:100%;">Open Application Dashboard</button>
        </div>

        <button class="btn-danger-link" id="disconnectBtn">Disconnect / Log Out</button>
        <div class="status" id="status">Ready</div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
