<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobXApply // Authentication Callback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-glass.css">
<link rel="icon" type="image/png" href="assets/app-logo.png?v=5">
<style>
body {
  font-family: 'Inter', sans-serif;
  background: #0B1020;
  color: #f4f7ff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.loader-card {
  width: 100%;
  max-width: 400px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 36px 28px;
  text-align: center;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}
.spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #5B4FE8;
  border-right-color: #2FDDC4;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="loader-card">
  <div class="spinner"></div>
  <h3 style="font-family: var(--display, 'Barlow Condensed', sans-serif); font-size: 20px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;">
    Authenticating Session...
  </h3>
  <p id="callback-status" style="font-family: var(--mono, monospace); font-size: 11px; color: rgba(244,247,255,0.65); margin-top: 10px;">
    Connecting to secure sync vault...
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://fbyjrfrejgzcpqtdwudu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZieWpyZnJlamd6Y3BxdGR3dWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODk0NTIsImV4cCI6MjEwMjM2NTQ1Mn0.L_21DGKOHU4HQ05IY9MqvDwklh2knTkjMObHmDIB0Ic";
const SYNC_API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:8787/api'
  : 'https://jobxapply-backend.onrender.com/api';

const statusText = document.getElementById("callback-status");

function parseJwtEmail(token) {
  try {
    const base64Url = token.split(".")[1];
    const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
    const jsonPayload = decodeURIComponent(
      atob(base64).split("").map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")
    );
    return JSON.parse(jsonPayload).email || "";
  } catch (e) {
    return "";
  }
}

let isProcessing = false;
async function processSession(token, userEmail = "") {
  if (isProcessing || !token) return;
  isProcessing = true;

  try {
    const email = userEmail || parseJwtEmail(token);
    statusText.textContent = "Session verified. Checking profile...";
    
    // Store credentials safely
    localStorage.setItem("jxa_token", token);
    localStorage.setItem("jxa_last_active", String(Date.now()));
    if (email) localStorage.setItem("jxa_user_email", email);

    // Call profile endpoint to check if existing user with completed profile or new user
    let isExistingUser = false;
    let isAdmin = false;

    try {
      const profileRes = await fetch(`${SYNC_API}/profile`, {
        headers: { "Authorization": `Bearer ${token}` },
        cache: "no-store"
      });

      if (profileRes.ok) {
        const stateData = await profileRes.json();
        localStorage.setItem("jxa_role", stateData.role || "user");
        if (stateData.user?.email) {
          localStorage.setItem("jxa_user_email", stateData.user.email);
        }
        
        if (stateData.role === "admin") {
          isAdmin = true;
        }

        // Check if user has an existing completed profile
        const profile = stateData?.profile || {};
        if (profile.fullName && String(profile.fullName).trim().length > 0) {
          isExistingUser = true;
          localStorage.setItem("jxa_local_profile", JSON.stringify(profile));
          localStorage.setItem("jxa_local_state", JSON.stringify(stateData));
        }
      }
    } catch(fetchErr) {
      console.warn("Backend sync check warning:", fetchErr);
    }

    if (isAdmin) {
      statusText.textContent = "Admin verified. Opening Command Center...";
      window.location.replace("admin/index.html");
      return;
    }

    if (isExistingUser) {
      statusText.textContent = "Welcome back! Redirecting to dashboard...";
      window.location.replace("dashboard.html");
    } else {
      statusText.textContent = "New account detected! Starting onboarding...";
      window.location.replace("onboarding.html");
    }
  } catch (err) {
    console.error("Callback processing error:", err);
    window.location.replace("onboarding.html");
  }
}

async function handleCallback() {
  // 1. Direct Hash Check (access_token in URL hash)
  const hash = window.location.hash.substring(1);
  if (hash) {
    const params = new URLSearchParams(hash);
    const token = params.get("access_token");
    if (token) {
      await processSession(token);
      return;
    }
  }

  // 2. Query Param Check (code or token)
  const searchParams = new URLSearchParams(window.location.search);
  const queryToken = searchParams.get("access_token");
  if (queryToken) {
    await processSession(queryToken);
    return;
  }

  // 3. Supabase Client Session Verification
  try {
    if (typeof supabase !== "undefined") {
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session?.access_token) {
          processSession(session.access_token, session.user?.email);
        }
      });

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.access_token) {
        await processSession(session.access_token, session.user?.email);
        return;
      }
    }
  } catch (err) {
    console.warn("Supabase session check:", err);
  }

  // 4. Fallback if no token could be recovered after 2.5 seconds
  setTimeout(() => {
    if (!isProcessing) {
      statusText.style.color = "#ff6b6b";
      statusText.textContent = "Authentication incomplete. Returning to login...";
      setTimeout(() => window.location.replace("auth.html"), 1200);
    }
  }, 2500);
}

handleCallback();
</script>
</body>
</html>
