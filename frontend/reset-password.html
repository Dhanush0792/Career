<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobXApply // Reset Password</title>
<meta name="description" content="Set a new password for your JobXApply account">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="shared-shell.js?v=2"></script>
<style>
:root {
  --base: #0B1020;
  --primary: #5B4FE8;
  --success: #2FDDC4;
  --alert: #F5A623;
  --white: #ffffff;
  --text: #f4f7ff;
  --muted: rgba(244,247,255,0.65);
  --dim: rgba(244,247,255,0.4);
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.15);
  --mono: 'JetBrains Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
  --body: 'Inter', sans-serif;
  --rejected: #eb5757;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--body);
  color: var(--text);
  background-color: var(--base);
  background-image: radial-gradient(circle at 15% 20%, rgba(91,79,232,0.12) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(47,221,196,0.07) 0%, transparent 45%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
body::after {
  content:''; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 160px 160px;
}
.main-content {
  flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 24px 60px; position: relative; z-index: 10;
}
.glass-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  backdrop-filter: blur(16px);
  padding: 40px;
  width: 100%;
  max-width: 440px;
  text-align: center;
}
.card-title {
  font-family: var(--display);
  font-size: 28px;
  color: var(--white);
  text-transform: uppercase;
  margin: 0 0 12px 0;
  letter-spacing: 0.05em;
}
.card-subtitle {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 32px 0;
}
.form-group {
  margin-bottom: 20px;
  text-align: left;
}
.form-input {
  width: 100%;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: var(--white);
  padding: 12px 16px;
  font-family: var(--body);
  font-size: 15px;
  transition: border-color 0.2s;
}
.form-input:focus {
  outline: none;
  border-color: var(--primary);
}
.btn-primary {
  width: 100%;
  background: var(--primary);
  color: var(--white);
  border: none;
  border-radius: 8px;
  padding: 14px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}
.btn-primary:hover {
  background: #6c61f0;
  transform: translateY(-1px);
}
.back-link {
  display: inline-block;
  margin-top: 24px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-family: var(--body);
  transition: color 0.2s;
}
.back-link:hover {
  color: var(--white);
}
.success-msg {
  display: none;
  color: var(--success);
  font-family: var(--mono);
  font-size: 12px;
  margin-top: 16px;
  padding: 12px;
  background: rgba(47, 221, 196, 0.1);
  border: 1px solid rgba(47, 221, 196, 0.2);
  border-radius: 6px;
}
.error-msg {
  display: none;
  color: var(--rejected);
  font-family: var(--mono);
  font-size: 12px;
  margin-top: 16px;
  padding: 12px;
  background: rgba(235, 87, 87, 0.1);
  border: 1px solid rgba(235, 87, 87, 0.2);
  border-radius: 6px;
  text-align: left;
}
</style>
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
<script src="public-nav.js"></script>

<div class="main-content">
  <div class="glass-card">
    <h1 class="card-title">Set New Password</h1>
    <p class="card-subtitle" id="subtitle-msg">Specify your new secure access credentials.</p>
    
    <form id="reset-password-form" onsubmit="handleResetPassword(event)">
      <div class="form-group">
        <input type="password" class="form-input" id="new-password" placeholder="New Password (min 8 chars)" required>
      </div>
      <div class="form-group">
        <input type="password" class="form-input" id="confirm-password" placeholder="Confirm New Password" required>
      </div>
      <button type="submit" class="btn-primary">Update Password</button>
      <div id="success-message" class="success-msg">Password updated successfully. Redirecting to login...</div>
      <div id="error-message" class="error-msg"></div>
    </form>
    
    <a href="auth.html" class="back-link">← Back to Login</a>
  </div>
</div>

<script>
// Parse token and email from query string
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
const email = urlParams.get('email');

if (!token || !email) {
  document.getElementById('reset-password-form').style.display = 'none';
  const err = document.getElementById('error-message');
  err.textContent = 'Error: Invalid or missing password reset parameters in URL link.';
  err.style.display = 'block';
  document.getElementById('subtitle-msg').textContent = 'Your password reset link is malformed.';
}

async function handleResetPassword(event) {
  event.preventDefault();
  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  const successDiv = document.getElementById('success-message');
  const errorDiv = document.getElementById('error-message');
  const btn = document.querySelector('.btn-primary');

  successDiv.style.display = 'none';
  errorDiv.style.display = 'none';

  if (newPassword !== confirmPassword) {
    errorDiv.textContent = 'Passwords do not match.';
    errorDiv.style.display = 'block';
    return;
  }

  btn.style.opacity = '0.5';
  btn.disabled = true;

  try {
    const res = await fetch(`${SYNC_API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token, newPassword })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Failed to reset password');
    }
    successDiv.style.display = 'block';
    setTimeout(() => {
      window.location.href = 'auth.html';
    }, 2000);
  } catch (err) {
    errorDiv.textContent = err.message;
    errorDiv.style.display = 'block';
    btn.style.opacity = '1';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
