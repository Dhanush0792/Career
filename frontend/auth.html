<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobXApply // Authentication Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-glass.css">
<style>
:root {
  --black:   #0B1020;
  --s1:      rgba(255, 255, 255, 0.07);
  --s2:      rgba(7, 10, 24, 0.6);
  --border:  rgba(255, 255, 255, 0.12);
  --border2: rgba(255, 255, 255, 0.2);
  --white:   #ffffff;
  --text:    #f4f7ff;
  --muted:   rgba(244, 247, 255, 0.65);
  --dim:     rgba(244, 247, 255, 0.4);
  --orange:  #5B4FE8;
  --orange3: rgba(91, 79, 232, 0.06);
  --green:   #2FDDC4;
  --mono:    'JetBrains Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
  --body:    'Inter', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--body);
  background: var(--black);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image: radial-gradient(circle at 10% 20%, rgba(91, 79, 232, 0.15) 0%, transparent 40%),
                    radial-gradient(circle at 90% 80%, rgba(47, 221, 196, 0.08) 0%, transparent 40%);
  overflow-y: auto;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  z-index: 1; pointer-events: none;
  opacity: 0.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 160px 160px;
}
.auth-container {
  width: 100%;
  max-width: 480px;
  border: 1px solid var(--border);
  background: var(--s1);
  border-radius: 20px;
  overflow: hidden;
  backdrop-filter: blur(24px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  position: relative;
  z-index: 10;
}
.auth-header {
  border-bottom: 1px solid var(--border);
  display: flex;
}
.auth-tab {
  flex: 1;
  padding: 16px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-align: center;
  color: var(--dim);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.1s;
}
.auth-tab.active {
  color: var(--white);
  background: rgba(255, 255, 255, 0.05);
  border-bottom: 2px solid var(--orange);
}
.auth-body {
  padding: 24px;
}
.auth-title {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -.01em;
  text-transform: uppercase;
  color: var(--white);
  margin-bottom: 16px;
}
.auth-title em {
  font-style: normal;
  color: var(--orange);
}
.form-group {
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-group label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--muted);
  text-transform: uppercase;
}
.form-input {
  background: var(--s2);
  border: 1px solid var(--border);
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--white);
  outline: none;
  border-radius: 8px;
  transition: border-color 0.2s;
}
.form-input:focus {
  border-color: var(--orange);
}
.auth-submit-btn {
  width: 100%;
  height: 44px;
  background: var(--orange);
  color: var(--white);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  border: 1px solid var(--orange);
  cursor: pointer;
  border-radius: 12px;
  margin-top: 10px;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(91, 79, 232, 0.3);
}
.auth-submit-btn:hover {
  background: rgba(91, 79, 232, 0.85);
  box-shadow: 0 6px 20px rgba(91, 79, 232, 0.4);
}
.auth-submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.auth-terminal {
  background: #000;
  border-top: 1px solid var(--border);
  padding: 16px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  height: 100px;
  overflow-y: auto;
  line-height: 1.5;
}
.term-line {
  margin-bottom: 2px;
}
.term-line.info { color: var(--orange); }
.term-line.success { color: var(--green); }

.back-link {
  display: inline-block;
  margin-top: 16px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--dim);
  letter-spacing: .08em;
  text-transform: uppercase;
  text-decoration: none;
  transition: color 0.2s;
}
.back-link:hover {
  color: var(--orange);
}
.form-input { width: 100%; }
.pw-wrap { position: relative; }
.pw-wrap .form-input { padding-right: 44px; width: 100%; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--dim); font-size: 14px; padding: 4px;
  transition: color .2s;
}
.pw-toggle:hover { color: var(--orange); }
.field-error {
  font-family: var(--mono); font-size: 9px; color: #ff6b6b;
  margin-top: 4px; display: none;
}
.field-error.show { display: block; }
.form-group.has-error .form-input { border-color: rgba(255,107,107,0.6); }
.form-group.has-error .field-error { display: block; }
.auth-links {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 16px;
}
.signup-only { display: none; }
</style>

  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

<div class="auth-container">
  <div class="auth-body">
    <h2 class="auth-title" id="auth-title">OPERATIVE <em>SIGN IN</em></h2>
    <p style="font-size: 12px; color: var(--muted); margin-bottom: 24px; line-height: 1.5;">
      Access your secure job application space and profile sync vault. Signup and Signin are managed seamlessly via Google.
    </p>

    <!-- Google Sign-In Button -->
    <button type="button" class="google-btn" onclick="handleGoogleLogin()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-links" style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px;">
      <a href="index.html" class="back-link">&lsaquo; RETURN HOME</a>
      <a href="privacy-terms.html" target="_blank" class="back-link">PRIVACY & TERMS</a>
    </div>
  </div>
  
  <div class="auth-terminal" id="auth-terminal">
    <div class="term-line">[SYS_INIT] Google OAuth Gateway ready.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
<script src="shared-shell.js?v=2"></script>
<script>
// Supabase Configuration
// IMPORTANT: Paste your actual Supabase project credentials below!
const SUPABASE_URL = window.SUPABASE_URL || "https://your-project.supabase.co";
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "your-supabase-anon-key";

let supabaseClient = null;
const terminal = document.getElementById('auth-terminal');

function addLog(text, className = '') {
  const line = document.createElement('div');
  line.className = 'term-line ' + className;
  line.textContent = text;
  terminal.appendChild(line);
  terminal.scrollTop = terminal.scrollHeight;
}

try {
  if (SUPABASE_URL && SUPABASE_URL !== "https://your-project.supabase.co") {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    addLog('[SYS_INIT] Supabase client active.');
  } else {
    addLog('[SYS_WARN] Supabase credentials not set in auth.html.', 'info');
  }
} catch (e) {
  addLog('[SYS_ERR] Initialization failed: ' + e.message, 'info');
}

async function handleGoogleLogin() {
  if (!supabaseClient) {
    addLog('[AUTH_ERR] Supabase client is unconfigured.', 'info');
    alert('Please configure SUPABASE_URL and SUPABASE_ANON_KEY inside auth.html.');
    return;
  }
  
  addLog('[AUTH_EXEC] Redirecting to Google OAuth...');
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/auth-callback.html'
      }
    });
    if (error) throw error;
  } catch (err) {
    addLog('[AUTH_ERR] ' + err.message, 'info');
  }
}

// Redirect if already logged in
if (localStorage.getItem('jxa_token')) {
  if (localStorage.getItem('jxa_role') === 'admin') {
    window.location.replace('admin/index.html');
  } else {
    window.location.replace('dashboard.html');
  }
}
</script>
</body>
</html>
