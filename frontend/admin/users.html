<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerHub Admin // Users</title>
<meta name="description" content="User Management">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style-glass.css">
<script src="../shared-shell.js?v=2"></script>
<style>
  :root {
    --base: #0B1020;
    --primary: #5B4FE8;
    --success: #2FDDC4;
    --alert: #F5A623;
    --white: #ffffff;
    --text: #f4f7ff;
    --muted: rgba(244,247,255,0.65);
    --dim: rgba(244,247,255,0.4);
    --glass-bg: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.15);
    --mono: 'JetBrains Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'Inter', sans-serif;
  }
  body { 
    padding-top: 70px; 
    background-color: var(--base);
    color: var(--text);
    font-family: var(--body);
    background-image: radial-gradient(circle at 15% 20%, rgba(245,166,35,0.12) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(91,79,232,0.07) 0%, transparent 45%);
    min-height: 100vh;
    margin: 0;
  }
  body::after {
    content:''; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.022;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 160px 160px;
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 10; }
  
  h1 {
    font-family: var(--display);
    font-size: 36px;
    color: var(--alert);
    text-transform: uppercase;
    margin: 0 0 24px 0;
    letter-spacing: 0.02em;
  }
  
  .warn-banner {
    background: rgba(245,166,35,0.1);
    border: 1px solid rgba(245,166,35,0.3);
    color: var(--alert);
    padding: 12px 16px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 16px;
    border-radius: 12px;
    backdrop-filter: blur(16px);
  }
  
  .search-input {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    color: var(--white);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    width: 300px;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--alert);
  }
  
  .btn-export {
    background: rgba(245,166,35,0.1);
    border: 1px solid var(--alert);
    color: var(--alert);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .btn-export:hover {
    background: var(--alert);
    color: var(--base);
  }
  
  .table-container {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    backdrop-filter: blur(16px);
    overflow: hidden;
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }
  
  th {
    font-family: var(--display);
    font-size: 16px;
    color: var(--alert);
    text-transform: uppercase;
    padding: 16px 24px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.2);
  }
  
  td {
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  
  .td-mono { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  
  .role-badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .role-admin { background: rgba(245,166,35,0.15); color: var(--alert); border: 1px solid rgba(245,166,35,0.3); }
  .role-user { background: rgba(255,255,255,0.1); color: var(--muted); border: 1px solid rgba(255,255,255,0.2); }
  
  .action-buttons {
    display: flex;
    gap: 8px;
  }
  
  .btn-action {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--white);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-action:hover:not(:disabled) {
    background: rgba(255,255,255,0.15);
    border-color: var(--white);
  }
  .btn-action:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>

  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

<!-- Admin Nav -->
<nav style="position:fixed;top:0;left:0;right:0;height:56px;background:rgba(11,16,32,0.9);border-bottom:1px solid rgba(245,166,35,0.3);backdrop-filter:blur(16px);z-index:1000;display:flex;align-items:center;">
  <div style="max-width:1400px;margin:0 auto;padding:0 20px;width:100%;display:flex;align-items:center;gap:24px;">
    <a href="index.html" style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#F5A623;text-decoration:none;">[CH ADMIN]</a>
    <div style="display:flex;gap:4px;flex:1;">
      <a href="index.html" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(244,247,255,0.65);padding:8px 14px;text-decoration:none;text-transform:uppercase;">Overview</a>
      <a href="users.html" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#F5A623;padding:8px 14px;text-decoration:none;text-transform:uppercase;background:rgba(245,166,35,0.1);border-radius:6px;">Users</a>
      <a href="portal-maps.html" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(244,247,255,0.65);padding:8px 14px;text-decoration:none;text-transform:uppercase;">Portal Maps</a>
      <a href="reports.html" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(244,247,255,0.65);padding:8px 14px;text-decoration:none;text-transform:uppercase;">Reports</a>
      <a href="analytics.html" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(244,247,255,0.65);padding:8px 14px;text-decoration:none;text-transform:uppercase;">Analytics</a>
    </div>
    <a href="../dashboard.html" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(244,247,255,0.65);text-decoration:none;text-transform:uppercase;padding:8px 14px;">← Back to App</a>
    <button onclick="logout()" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(244,247,255,0.45);border:1px solid rgba(255,255,255,0.15);padding:6px 14px;border-radius:8px;background:transparent;cursor:pointer;transition:all 0.2s;">LOGOUT</button>
  </div>
</nav>

<div class="container">
  <h1>USER REGISTRY</h1>
  
  <div class="warn-banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    This is a prototype. User records shown below are simulated. Production builds will use a database with proper multi-user isolation.
  </div>
  
  <div class="toolbar">
    <input type="text" class="search-input" placeholder="Search by email..." id="search-input">
    <button class="btn-export" onclick="alert('Export functionality disabled in prototype.')">Export CSV</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Profile Version</th>
          <th>Last Sync</th>
          <th>Role</th>
          <th>Subscription Tier</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody">
        <!-- populated by JS -->
      </tbody>
    </table>
  </div>
</div>

<script>
  requireAuth();
  
  if (localStorage.getItem('jxa_role') !== 'admin') {
    window.location.href = '../dashboard.html';
  }

  function logout() {
    localStorage.removeItem('jxa_token');
    localStorage.removeItem('jxa_role');
    window.location.href = '../auth.html';
  }

  const mockUsers = [
    { email: 'admin@jobxapply.app', name: 'System Admin', version: 'v2.4', sync: '2 mins ago', role: 'admin', id: 'm1', tier: 'paid' },
    { email: 'johndoe@example.com', name: 'John Doe', version: 'v1.1', sync: '5 hours ago', role: 'user', id: 'm2', tier: 'free' }
  ];

  let loadedUsers = [];

  async function loadUsers() {
    const token = localStorage.getItem("jxa_token");
    let users = mockUsers;
    
    try {
      const res = await fetch(`${SYNC_API}/admin/users`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        if (data.users) {
          users = data.users.map(u => ({
            id: u.id,
            email: u.email,
            name: u.name || "Unnamed User",
            version: "v1.0",
            sync: u.lastSync ? new Date(u.lastSync).toLocaleString() : "Never",
            role: u.role,
            tier: u.tier || "free"
          }));
        }
      }
    } catch(e) {
      console.log('API not available, using mock registry.', e);
    }

    loadedUsers = users;
    renderTable(loadedUsers);

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = loadedUsers.filter(u => u.email.toLowerCase().includes(q) || u.name.toLowerCase().includes(q));
      renderTable(filtered);
    });
  }

  function renderTable(users) {
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '';
    
    if (users.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:40px;">No users found.</td></tr>`;
      return;
    }

    users.forEach(u => {
      const tr = document.createElement('tr');
      const roleClass = u.role === 'admin' ? 'role-admin' : 'role-user';
      
      tr.innerHTML = `
        <td class="td-mono" style="color:var(--white)">${u.email}</td>
        <td>${u.name}</td>
        <td class="td-mono">${u.version}</td>
        <td class="td-mono">${u.sync}</td>
        <td><span class="role-badge ${roleClass}">${u.role}</span></td>
        <td>
          <select class="select-input" style="padding:4px 8px; font-size:11px; font-family:var(--mono);" onchange="updateTier('${u.id}', this.value)">
            <option value="free" ${u.tier === 'free' ? 'selected' : ''}>FREE</option>
            <option value="paid" ${u.tier === 'paid' ? 'selected' : ''}>PAID</option>
          </select>
        </td>
        <td>
          <div class="action-buttons">
            <button class="btn-action" onclick="alert('Viewing profiles under client encryption is disabled. Data is protected by client passcode keys.')">View</button>
            <button class="btn-action" style="color:#ff6b6b;border-color:rgba(255,107,107,0.3)" onclick="deleteUser('${u.id}')">Delete</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function updateTier(id, tier) {
    if (id.startsWith('m')) {
      alert("Simulated user records cannot be updated.");
      return;
    }
    try {
      const token = localStorage.getItem("jxa_token");
      const res = await fetch(`${SYNC_API}/admin/users/${id}/tier`, {
        method: 'POST',
        headers: { 
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ tier })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        alert("User tier updated successfully!");
        loadUsers();
      } else {
        alert("Update failed: " + (data.error || "Server error"));
      }
    } catch (e) {
      alert("Network error updating user tier: " + e.message);
    }
  }

  async function deleteUser(id) {
    if (id.startsWith('m')) {
      alert("Simulated user records cannot be deleted.");
      return;
    }
    if (!confirm("Are you sure you want to permanently delete this user and all associated sync blobs?")) {
      return;
    }
    try {
      const token = localStorage.getItem("jxa_token");
      const res = await fetch(`${SYNC_API}/admin/users/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        alert("User deleted successfully.");
        loadUsers();
      } else {
        alert("Deletion failed: " + (data.error || "Server error"));
      }
    } catch (e) {
      alert("Network error deleting user: " + e.message);
    }
  }

  loadUsers();
</script>
</body>
</html>
