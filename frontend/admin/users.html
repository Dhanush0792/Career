<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobXApply Admin // User Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style-glass.css">
<script src="../shared-shell.js?v=2"></script>
<script src="admin-shell.js"></script>
<link rel="icon" type="image/png" href="../assets/app-logo.png?v=4">
<style>
  :root {
    --base: #0B1020;
    --primary: #5B4FE8;
    --success: #2FDDC4;
    --alert: #F5A623;
    --danger: #F55A23;
    --white: #ffffff;
    --text: #f4f7ff;
    --muted: rgba(244,247,255,0.65);
    --dim: rgba(244,247,255,0.4);
    --glass-bg: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.12);
    --mono: 'JetBrains Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'Inter', sans-serif;
  }
  body {
    padding-top: 70px;
    background-color: var(--base);
    color: var(--text);
    font-family: var(--body);
    background-image: radial-gradient(circle at 15% 20%, rgba(245,166,35,0.1) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(91,79,232,0.07) 0%, transparent 45%);
    min-height: 100vh;
    margin: 0;
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 10; }
  
  h1 {
    font-family: var(--display);
    font-size: 36px;
    color: var(--alert);
    text-transform: uppercase;
    margin: 0 0 20px 0;
    letter-spacing: 0.02em;
  }

  .privacy-callout {
    background: rgba(47,221,196,0.08);
    border: 1px solid rgba(47,221,196,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--success);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 14px 18px;
    border-radius: 10px;
    backdrop-filter: blur(16px);
    flex-wrap: wrap;
  }
  .search-box {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    color: var(--white);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    width: 260px;
    outline: none;
  }
  .search-box:focus { border-color: var(--alert); }

  .filter-select {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    color: var(--white);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
  }

  .btn-export {
    background: rgba(245,166,35,0.1);
    border: 1px solid var(--alert);
    color: var(--alert);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
  }

  .table-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th {
    font-family: var(--display);
    font-size: 15px;
    color: var(--alert);
    text-transform: uppercase;
    padding: 14px 20px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.2);
  }
  td {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .td-mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-admin { background: rgba(245,166,35,0.15); color: var(--alert); border: 1px solid rgba(245,166,35,0.3); }
  .badge-user { background: rgba(255,255,255,0.08); color: var(--muted); border: 1px solid rgba(255,255,255,0.15); }
  .badge-active { background: rgba(47,221,196,0.1); color: var(--success); border: 1px solid rgba(47,221,196,0.3); }
  .badge-suspended { background: rgba(245,90,35,0.15); color: var(--danger); border: 1px solid rgba(245,90,35,0.3); }

  .actions-cell {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .btn-sm {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: var(--white);
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-sm:hover { background: rgba(255,255,255,0.15); }
  .btn-sm.warn { color: var(--alert); border-color: rgba(245,166,35,0.3); }
  .btn-sm.danger { color: var(--danger); border-color: rgba(245,90,35,0.3); }
</style>
</head>
<body>

<nav id="admin-nav" style="position:fixed;top:0;left:0;right:0;height:56px;background:rgba(11,16,32,0.92);border-bottom:1px solid rgba(245,166,35,0.3);backdrop-filter:blur(16px);z-index:1000;display:flex;align-items:center;"></nav>

<div class="container">
  <h1>USER REGISTRY &amp; ACCESS</h1>

  <div class="privacy-callout">
    <span>Privacy Shield: Personal profile blobs are client-encrypted. Admin registry provides identity verification and access controls only.</span>
  </div>

  <div class="toolbar">
    <div style="display:flex; gap:10px; align-items:center; flex:1; flex-wrap:wrap;">
      <input type="text" class="search-box" id="search-input" placeholder="Search by email or user ID...">
      <select class="filter-select" id="filter-tier">
        <option value="all">All Tiers</option>
        <option value="free">Free</option>
        <option value="paid">Paid</option>
      </select>
      <select class="filter-select" id="filter-role">
        <option value="all">All Roles</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <select class="filter-select" id="filter-status">
        <option value="all">All Statuses</option>
        <option value="active">Active</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>
    <button class="btn-export" onclick="exportUsersCSV()">Export CSV</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>User / ID</th>
          <th>Last Sync</th>
          <th>Role</th>
          <th>Status</th>
          <th>Tier</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody">
        <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px;font-family:var(--mono);">Loading users registry...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  renderAdminNav('users.html');
  verifyAdminAccess(loadUsers);

  let allUsers = [];

  async function loadUsers() {
    try {
      const res = await adminFetch('/admin/users');
      if (res.ok) {
        const data = await res.json();
        allUsers = data.users || [];
        renderTable(allUsers);
      } else {
        showToast('Failed to load user list', 'error');
      }
    } catch(e) {
      showToast('Network error loading users', 'error');
    }
  }

  function renderTable(users) {
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '';

    if (users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px;font-family:var(--mono);">No users found.</td></tr>';
      return;
    }

    users.forEach(u => {
      const tr = document.createElement('tr');
      const safeId = escHtml(u.id);
      const safeEmail = escHtml(u.email);
      const safeRole = escHtml(u.role || 'user');
      const isSuspended = u.status === 'suspended';
      const safeTier = escHtml(u.tier || 'free');
      const syncTime = timeSince(u.lastSync || u.last_sync || u.createdAt || u.created_at);

      tr.innerHTML = `
        <td>
          <div style="font-weight:600;color:var(--white);">${safeEmail}</div>
          <div class="td-mono" style="font-size:10px;">ID: ${safeId}</div>
        </td>
        <td class="td-mono">${syncTime}</td>
        <td><span class="badge ${safeRole === 'admin' ? 'badge-admin' : 'badge-user'}">${safeRole}</span></td>
        <td><span class="badge ${isSuspended ? 'badge-suspended' : 'badge-active'}">${isSuspended ? 'Suspended' : 'Active'}</span></td>
        <td>
          <select class="filter-select" style="padding:2px 6px;font-size:11px;" onchange="changeTier('${safeId}', this.value)">
            <option value="free" ${safeTier === 'free' ? 'selected' : ''}>FREE</option>
            <option value="paid" ${safeTier === 'paid' ? 'selected' : ''}>PAID</option>
          </select>
        </td>
        <td>
          <div class="actions-cell">
            ${safeRole === 'admin' 
              ? `<button class="btn-sm warn" onclick="changeRole('${safeId}', 'user')">Demote</button>` 
              : `<button class="btn-sm warn" onclick="changeRole('${safeId}', 'admin')">Make Admin</button>`
            }
            ${isSuspended
              ? `<button class="btn-sm" style="color:var(--success);border-color:rgba(47,221,196,0.3);" onclick="reinstateUser('${safeId}')">Reinstate</button>`
              : `<button class="btn-sm danger" onclick="suspendUser('${safeId}')">Suspend</button>`
            }
            <button class="btn-sm danger" onclick="deleteUser('${safeId}')">Delete</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Live filter handlers
  ['search-input', 'filter-tier', 'filter-role', 'filter-status'].forEach(id => {
    document.getElementById(id).addEventListener('input', applyFilters);
    document.getElementById(id).addEventListener('change', applyFilters);
  });

  function applyFilters() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const t = document.getElementById('filter-tier').value;
    const r = document.getElementById('filter-role').value;
    const s = document.getElementById('filter-status').value;

    const filtered = allUsers.filter(u => {
      const matchQ = (u.email || '').toLowerCase().includes(q) || (u.id || '').toLowerCase().includes(q);
      const matchT = t === 'all' || (u.tier || 'free') === t;
      const matchR = r === 'all' || (u.role || 'user') === r;
      const matchS = s === 'all' || (s === 'suspended' ? u.status === 'suspended' : u.status !== 'suspended');
      return matchQ && matchT && matchR && matchS;
    });

    renderTable(filtered);
  }

  async function changeTier(userId, tier) {
    try {
      const res = await adminFetch(`/admin/users/${userId}/tier`, {
        method: 'POST',
        body: JSON.stringify({ tier })
      });
      if (res.ok) {
        showToast(`Tier updated to ${tier.toUpperCase()}`, 'success');
        loadUsers();
      } else {
        showToast('Failed to update tier', 'error');
      }
    } catch(e) {
      showToast('Network error updating tier', 'error');
    }
  }

  async function changeRole(userId, role) {
    if (!confirm(`Are you sure you want to change this user's role to ${role.toUpperCase()}?`)) return;
    try {
      const res = await adminFetch(`/admin/users/${userId}/role`, {
        method: 'POST',
        body: JSON.stringify({ role })
      });
      if (res.ok) {
        showToast(`Role updated to ${role.toUpperCase()}`, 'success');
        loadUsers();
      } else {
        showToast('Failed to update role', 'error');
      }
    } catch(e) {
      showToast('Network error updating role', 'error');
    }
  }

  async function suspendUser(userId) {
    if (!confirm('Suspend this user account?')) return;
    try {
      const res = await adminFetch(`/admin/users/${userId}/suspend`, { method: 'POST' });
      if (res.ok) {
        showToast('User suspended', 'info');
        loadUsers();
      } else {
        showToast('Failed to suspend user', 'error');
      }
    } catch(e) {
      showToast('Network error', 'error');
    }
  }

  async function reinstateUser(userId) {
    try {
      const res = await adminFetch(`/admin/users/${userId}/reinstate`, { method: 'POST' });
      if (res.ok) {
        showToast('User reinstated', 'success');
        loadUsers();
      } else {
        showToast('Failed to reinstate user', 'error');
      }
    } catch(e) {
      showToast('Network error', 'error');
    }
  }

  async function deleteUser(userId) {
    if (!confirm('Permanently delete this user and all their sync blobs? This cannot be undone.')) return;
    try {
      const res = await adminFetch(`/admin/users/${userId}`, { method: 'DELETE' });
      if (res.ok) {
        showToast('User permanently deleted', 'success');
        loadUsers();
      } else {
        showToast('Failed to delete user', 'error');
      }
    } catch(e) {
      showToast('Network error', 'error');
    }
  }

  function exportUsersCSV() {
    if (allUsers.length === 0) return alert('No users to export');
    const headers = ['ID', 'Email', 'Role', 'Status', 'Tier', 'LastSync'];
    const rows = allUsers.map(u => [
      u.id || '',
      u.email || '',
      u.role || 'user',
      u.status || 'active',
      u.tier || 'free',
      u.lastSync ? new Date(u.lastSync).toISOString() : ''
    ]);
    const csvContent = [headers.join(','), ...rows.map(r => r.map(f => `"${String(f).replace(/"/g, '""')}"`).join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `jobxapply-users-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }
</script>
</body>
</html>
