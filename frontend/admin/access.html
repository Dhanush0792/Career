<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobXApply Admin // Access & Audit Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style-glass.css">
<script src="../shared-shell.js?v=2"></script>
<script src="admin-shell.js"></script>
<link rel="icon" type="image/png" href="../assets/app-logo.png?v=4">
<style>
  :root {
    --base: #0B1020;
    --primary: #5B4FE8;
    --success: #2FDDC4;
    --alert: #F5A623;
    --danger: #F55A23;
    --white: #ffffff;
    --text: #f4f7ff;
    --muted: rgba(244,247,255,0.65);
    --dim: rgba(244,247,255,0.4);
    --glass-bg: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.12);
    --mono: 'JetBrains Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'Inter', sans-serif;
  }
  body {
    padding-top: 70px;
    background-color: var(--base);
    color: var(--text);
    font-family: var(--body);
    background-image: radial-gradient(circle at 15% 20%, rgba(245,166,35,0.1) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(91,79,232,0.07) 0%, transparent 45%);
    min-height: 100vh;
    margin: 0;
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 10; }
  
  h1 {
    font-family: var(--display);
    font-size: 36px;
    color: var(--alert);
    text-transform: uppercase;
    margin: 0 0 20px 0;
    letter-spacing: 0.02em;
  }

  .card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    padding: 24px;
    margin-bottom: 24px;
  }

  .card-header {
    font-family: var(--display);
    font-size: 20px;
    color: var(--alert);
    text-transform: uppercase;
    margin: 0 0 16px 0;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  table { width: 100%; border-collapse: collapse; text-align: left; }
  th {
    font-family: var(--display);
    font-size: 15px;
    color: var(--alert);
    text-transform: uppercase;
    padding: 12px 18px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.2);
  }
  td {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .td-mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-admin { background: rgba(245,166,35,0.15); color: var(--alert); border: 1px solid rgba(245,166,35,0.3); }
  .badge-action { background: rgba(91,79,232,0.15); color: var(--primary); border: 1px solid rgba(91,79,232,0.3); }
</style>
</head>
<body>

<nav id="admin-nav" style="position:fixed;top:0;left:0;right:0;height:56px;background:rgba(11,16,32,0.92);border-bottom:1px solid rgba(245,166,35,0.3);backdrop-filter:blur(16px);z-index:1000;display:flex;align-items:center;"></nav>

<div class="container">
  <h1>ACCESS GOVERNANCE &amp; AUDIT LOGS</h1>

  <!-- Access Audit Log -->
  <div class="card">
    <div class="card-header">
      <span>Access &amp; Role Change Audit Log</span>
      <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">Immutable chronological log</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Action</th>
          <th>Target User ID</th>
          <th>Actioned By</th>
        </tr>
      </thead>
      <tbody id="audit-tbody">
        <tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px;font-family:var(--mono);">Loading audit logs...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  renderAdminNav('access.html');
  verifyAdminAccess(loadAuditLogs);

  async function loadAuditLogs() {
    try {
      const res = await adminFetch('/admin/access-log');
      if (res.ok) {
        const data = await res.json();
        renderAuditTable(data.log || []);
      }
    } catch(e) {
      showToast('Error loading audit log', 'error');
    }
  }

  function renderAuditTable(logs) {
    const tbody = document.getElementById('audit-tbody');
    tbody.innerHTML = '';

    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px;font-family:var(--mono);">No access actions recorded yet.</td></tr>';
      return;
    }

    logs.forEach(l => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-mono">${new Date(l.timestamp).toLocaleString()}</td>
        <td><span class="badge badge-action">${escHtml(l.action)}</span></td>
        <td class="td-mono" style="color:var(--white);">${escHtml(l.targetUserId)}</td>
        <td class="td-mono">${escHtml(l.adminId)}</td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>
</body>
</html>
