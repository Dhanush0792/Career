<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobXApply // Forgot Password</title>
<meta name="description" content="Reset your JobXApply password">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --base: #0B1020;
  --primary: #5B4FE8;
  --success: #2FDDC4;
  --alert: #F5A623;
  --white: #ffffff;
  --text: #f4f7ff;
  --muted: rgba(244,247,255,0.65);
  --dim: rgba(244,247,255,0.4);
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.15);
  --mono: 'JetBrains Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
  --body: 'Inter', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--body);
  color: var(--text);
  background-color: var(--base);
  background-image: radial-gradient(circle at 15% 20%, rgba(91,79,232,0.12) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(47,221,196,0.07) 0%, transparent 45%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
body::after {
  content:''; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 160px 160px;
}
.public-nav {
  position:fixed;top:0;left:0;right:0;height:60px;background:rgba(11,16,32,0.9);border-bottom:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(16px);z-index:1000;display:flex;align-items:center;
}
.nav-container {
  max-width:1200px;margin:0 auto;padding:0 24px;width:100%;display:flex;align-items:center;justify-content:space-between;
}
.nav-logo {
  font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;text-decoration:none;display:flex;align-items:center;gap:6px;
}
.nav-links { display:flex;gap:4px; }
.nav-link {
  font-family:var(--mono);font-size:11px;color:var(--muted);padding:8px 14px;text-decoration:none;text-transform:uppercase;transition:color 0.2s;
}
.nav-link:hover { color: var(--white); }
.nav-actions { display:flex;gap:10px;align-items:center; }
.btn-get-started {
  display:inline-flex;align-items:center;height:38px;padding:0 20px;background:var(--primary);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:10px;text-decoration:none;transition:transform 0.2s, background 0.2s;
}
.btn-get-started:hover {
  transform: translateY(-1px);
  background: #6c61f0;
}
.main-content {
  flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 24px 60px; position: relative; z-index: 10;
}
.glass-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  backdrop-filter: blur(16px);
  padding: 40px;
  width: 100%;
  max-width: 440px;
  text-align: center;
}
.card-title {
  font-family: var(--display);
  font-size: 28px;
  color: var(--white);
  text-transform: uppercase;
  margin: 0 0 12px 0;
  letter-spacing: 0.05em;
}
.card-subtitle {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 32px 0;
}
.form-group {
  margin-bottom: 24px;
  text-align: left;
}
.form-input {
  width: 100%;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: var(--white);
  padding: 12px 16px;
  font-family: var(--body);
  font-size: 15px;
  transition: border-color 0.2s;
}
.form-input:focus {
  outline: none;
  border-color: var(--primary);
}
.btn-primary {
  width: 100%;
  background: var(--primary);
  color: var(--white);
  border: none;
  border-radius: 8px;
  padding: 14px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}
.btn-primary:hover {
  background: #6c61f0;
  transform: translateY(-1px);
}
.back-link {
  display: inline-block;
  margin-top: 24px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-family: var(--body);
  transition: color 0.2s;
}
.back-link:hover {
  color: var(--white);
}
.note {
  margin-top: 32px;
  font-size: 11px;
  color: var(--dim);
  line-height: 1.5;
}
.success-msg {
  display: none;
  color: var(--success);
  font-family: var(--mono);
  font-size: 12px;
  margin-top: 16px;
  padding: 12px;
  background: rgba(47, 221, 196, 0.1);
  border: 1px solid rgba(47, 221, 196, 0.2);
  border-radius: 6px;
}
@media (max-width: 768px) {
  .nav-links { display: none; }
}
</style>

  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
<script src="public-nav.js"></script>

<div class="main-content">
  <div class="glass-card">
    <h1 class="card-title">Reset Access Credentials</h1>
    <p class="card-subtitle">Enter your account email. We will send you instructions to reset your passcode.</p>
    
    <form id="reset-form" onsubmit="event.preventDefault(); showSuccess();">
      <div class="form-group">
        <input type="email" class="form-input" placeholder="Account Email" required>
      </div>
      <button type="submit" class="btn-primary">Send Instructions</button>
      <div id="success-message" class="success-msg">Instructions sent. Check your inbox.</div>
    </form>
    
    <a href="auth.html" class="back-link">← Back to Login</a>
    
    <div class="note">
      This resets your login password. Your sync vault passcode is separate and stored only on your device.
    </div>
  </div>
</div>

<script>
function showSuccess() {
  document.getElementById('success-message').style.display = 'block';
  document.querySelector('.btn-primary').style.opacity = '0.5';
  document.querySelector('.btn-primary').disabled = true;
}
</script>
</body>
</html>
