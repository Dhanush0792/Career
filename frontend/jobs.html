<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobXApply // Job Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-glass.css">
<script src="shared-shell.js?v=2"></script>
<style>
:root {
  --base: #0B1020;
  --primary: #5B4FE8;
  --success: #2FDDC4;
  --alert: #F5A623;
  --white: #ffffff;
  --text: #f4f7ff;
  --muted: rgba(244,247,255,0.65);
  --dim: rgba(244,247,255,0.4);
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.15);
  --mono: 'JetBrains Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
  --body: 'Inter', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--body);
  color: var(--text);
  background-color: var(--base);
  background-image: radial-gradient(circle at 15% 20%, rgba(91,79,232,0.12) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(47,221,196,0.07) 0%, transparent 45%);
  min-height: 100vh;
  padding-top: 80px;
}
body::after {
  content:''; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 160px 160px;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; position: relative; z-index: 10; }

.page-header { width: 100%; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px; }
.page-title { font-family: var(--display); font-size: 36px; color: var(--primary); text-transform: uppercase; margin: 0; letter-spacing: 0.05em; }

.search-box {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  backdrop-filter: blur(16px);
  padding: 24px;
  margin-bottom: 30px;
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
  gap: 16px;
  align-items: end;
}
@media (max-width: 990px) {
  .search-box { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  .search-box { grid-template-columns: 1fr; }
}

.search-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search-group label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  color: var(--muted);
}
.search-input, .search-select {
  background: rgba(7, 10, 24, 0.6);
  border: 1px solid var(--glass-border);
  padding: 12px 14px;
  font-family: var(--body);
  font-size: 13px;
  color: var(--white);
  border-radius: 8px;
  outline: none;
  transition: border-color 0.2s;
  height: 44px;
}
.search-input:focus, .search-select:focus {
  border-color: var(--primary);
}
.search-select option {
  background: #0B1020;
  color: var(--white);
}

.btn-search {
  background: var(--primary);
  color: var(--white);
  border: none;
  border-radius: 8px;
  padding: 14px 24px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  cursor: pointer;
  height: 44px;
  transition: background 0.2s, transform 0.1s;
}
.btn-search:hover { background: #6c61f0; }

.recs-header {
  font-family: var(--display);
  font-size: 20px;
  color: var(--success);
  margin: 30px 0 16px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 20px;
}

.job-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  backdrop-filter: blur(16px);
  padding: 24px;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s, border-color 0.2s;
  position: relative;
}
.job-card:hover {
  transform: translateY(-4px);
  border-color: rgba(91,79,232,0.4);
}

.job-badge-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.job-company {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--success);
  text-transform: uppercase;
}
.job-portal {
  font-family: var(--mono);
  font-size: 9px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted);
  padding: 2px 8px;
  border-radius: 4px;
}

.match-badge {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(47,221,196,0.12);
  color: var(--success);
  border: 1px solid rgba(47,221,196,0.2);
}
.match-badge.low {
  background: rgba(245,166,35,0.08);
  color: var(--alert);
  border-color: rgba(245,166,35,0.2);
}
.match-badge.none {
  background: rgba(255,255,255,0.02);
  color: var(--dim);
  border-color: rgba(255,255,255,0.05);
}

.job-title {
  font-family: var(--display);
  font-size: 22px;
  color: var(--white);
  margin: 0 0 8px 0;
  text-transform: uppercase;
  line-height: 1.2;
}
.job-meta {
  display: flex;
  gap: 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  margin-bottom: 14px;
}
.job-desc {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 20px;
  flex: 1;
}

.skills-preview {
  margin-bottom: 20px;
}
.skills-preview-title {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 6px;
}
.skills-list-span {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.skill-item-tag {
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.03);
  color: var(--muted);
}
.skill-item-tag.match {
  color: var(--success);
  background: rgba(47,221,196,0.08);
}

.job-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  border-top: 1px solid rgba(255,255,255,0.05);
  padding-top: 16px;
}
.job-salary {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--alert);
}
.btn-apply {
  background: transparent;
  color: var(--white);
  border: 1px solid var(--primary);
  border-radius: 8px;
  padding: 8px 16px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-apply:hover {
  background: var(--primary);
}

.empty-state {
  grid-column: 1 / -1;
  background: var(--glass-bg);
  border: 1px dashed var(--glass-border);
  border-radius: 14px;
  padding: 60px 40px;
  text-align: center;
}
</style>
</head>
<body>
<nav class="nav" id="main-nav"></nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Job Discovery</h1>
  </div>

  <form class="search-box" id="search-form" onsubmit="event.preventDefault(); searchJobs();">
    <div class="search-group">
      <label>Keyword / Role</label>
      <input type="text" class="search-input" id="search-q" placeholder="e.g. Software, React, TCS">
    </div>
    <div class="search-group">
      <label>Location</label>
      <input type="text" class="search-input" id="search-l" placeholder="e.g. Bangalore, Remote">
    </div>
    
    <div class="search-group">
      <label>ATS Match level</label>
      <select class="search-select" id="filter-match">
        <option value="all">All Match Levels</option>
        <option value="high">High Matches (75%+)</option>
        <option value="med">Medium Matches (40%+)</option>
      </select>
    </div>

    <div class="search-group">
      <label>Portal / ATS</label>
      <select class="search-select" id="filter-portal">
        <option value="all">All Portals</option>
        <option value="Greenhouse">Greenhouse</option>
        <option value="Lever">Lever</option>
        <option value="Workday">Workday</option>
        <option value="Ashby">Ashby</option>
        <option value="LinkedIn">LinkedIn</option>
      </select>
    </div>

    <button type="submit" class="btn-search">Search Jobs</button>
  </form>

  <div id="recs-section" style="display:none; margin-bottom:30px;">
    <div class="recs-header">
      <span>★</span> Highly Recommended For You
    </div>
    <div class="results-grid" id="recs-container"></div>
  </div>

  <div class="recs-header" style="color:var(--white); font-size:18px; margin-top:20px;">
    All Job Listings
  </div>
  <div class="results-grid" id="jobs-container">
    <div class="empty-state">
      <div class="empty-state__label">Initiate Search</div>
      <div class="empty-state__hint">Enter keywords to query JobXApply's global job search pipeline.</div>
    </div>
  </div>
</div>

<script>
if(typeof requireAuth === 'function') requireAuth();
if(typeof renderNav === 'function') renderNav(document.getElementById('main-nav'), 'jobs.html');

let userProfile = null;

async function fetchUserProfile() {
  try {
    const rawState = localStorage.getItem('jxa_local_state');
    if (rawState) {
      const parsed = JSON.parse(rawState);
      const activeId = parsed.activeProfileId || "default";
      userProfile = parsed.profile || (parsed.profiles && parsed.profiles[activeId]) || {};
    } else {
      userProfile = JSON.parse(localStorage.getItem('jxa_local_profile') || '{}');
    }
  } catch (e) {
    userProfile = {};
  }
}

async function searchJobs() {
  await fetchUserProfile();
  
  const q = document.getElementById("search-q").value.trim();
  const l = document.getElementById("search-l").value.trim();
  const matchFilter = document.getElementById("filter-match").value;
  const portalFilter = document.getElementById("filter-portal").value;
  
  const container = document.getElementById("jobs-container");
  const recsContainer = document.getElementById("recs-container");
  const recsSection = document.getElementById("recs-section");
  
  container.innerHTML = `
    <div class="empty-state">
      <div class="empty-state__label" style="color:var(--primary)">Searching...</div>
      <div class="empty-state__hint">Querying database adapters and live integrations.</div>
    </div>
  `;

  recsSection.style.display = "none";
  recsContainer.innerHTML = "";

  try {
    const token = localStorage.getItem("jxa_token") || "";
    const headers = {};
    if (token) {
      headers["Authorization"] = `Bearer ${token}`;
    }
    const response = await fetch(`/api/jobs/search?q=${encodeURIComponent(q)}&l=${encodeURIComponent(l)}`, { headers });
    const data = await response.json();

    if (response.ok && data.jobs && data.jobs.length > 0) {
      
      // Calculate matching scores and map
      let jobs = data.jobs.map(job => {
        const required = job.skillsRequired || [];
        let matched = [];
        let score = 0;

        if (userProfile && userProfile.skills && required.length > 0) {
          const profileSkills = userProfile.skills.split(',').map(s => s.trim().toLowerCase());
          matched = required.filter(s => profileSkills.includes(s.toLowerCase()));
          score = Math.round((matched.length / required.length) * 100);
        }

        return {
          ...job,
          matchScore: score,
          matchedSkills: matched
        };
      });

      // Filter by Portal
      if (portalFilter !== 'all') {
        jobs = jobs.filter(j => j.portal.toLowerCase() === portalFilter.toLowerCase());
      }

      // Filter by Match Level
      if (matchFilter === 'high') {
        jobs = jobs.filter(j => j.matchScore >= 75);
      } else if (matchFilter === 'med') {
        jobs = jobs.filter(j => j.matchScore >= 40);
      }

      // Sort by match score (highest first)
      jobs.sort((a, b) => b.matchScore - a.matchScore);

      // Recommendations (Top matches >= 50%)
      const recommended = jobs.filter(j => j.matchScore >= 50).slice(0, 3);

      if (recommended.length > 0 && matchFilter === 'all' && portalFilter === 'all' && !q) {
        recsSection.style.display = "block";
        recsContainer.innerHTML = recommended.map(job => renderJobCard(job, true)).join("");
      }

      if (jobs.length > 0) {
        container.innerHTML = jobs.map(job => renderJobCard(job, false)).join("");
      } else {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__label">Zero Results</div>
            <div class="empty-state__hint">No active job listings match your current filters.</div>
          </div>
        `;
      }
    } else {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state__label">Zero Results</div>
          <div class="empty-state__hint">No active job listings match your current keywords.</div>
        </div>
      `;
    }
  } catch (err) {
    console.error("Job search failed:", err);
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__label" style="color:var(--alert)">Search Failed</div>
        <div class="empty-state__hint">The job sync proxy server appears to be offline. Verify your server connection.</div>
      </div>
    `;
  }
}

function renderJobCard(job, isRecommended) {
  const isHighMatch = job.matchScore >= 75;
  const isMedMatch = job.matchScore >= 40 && job.matchScore < 75;
  
  let matchClass = 'none';
  let badgeText = 'NO PROFILE SKILLS MATCH';

  if (job.matchScore > 0) {
    matchClass = isHighMatch ? 'high' : 'low';
    badgeText = `${job.matchScore}% ATS MATCH`;
  }

  const required = job.skillsRequired || [];

  return `
    <div class="job-card">
      <div class="job-badge-row">
        <span class="job-company">${escapeHtml(job.company)}</span>
        <span class="match-badge ${matchClass}">${badgeText}</span>
      </div>
      <h3 class="job-title">${escapeHtml(job.title)}</h3>
      <div class="job-meta">
        <span>📍 ${escapeHtml(job.location)}</span>
        <span>🕒 ${escapeHtml(job.postedAt)}</span>
      </div>
      <p class="job-desc">${escapeHtml(job.description)}</p>
      
      ${required.length > 0 ? `
        <div class="skills-preview">
          <div class="skills-preview-title">Required Core Skills</div>
          <div class="skills-list-span">
            ${required.map(s => {
              const matched = job.matchedSkills.some(m => m.toLowerCase() === s.toLowerCase());
              return `<span class="skill-item-tag ${matched ? 'match' : ''}">${escapeHtml(s)}</span>`;
            }).join("")}
          </div>
        </div>
      ` : ''}

      <div class="job-actions">
        <span class="job-salary">${escapeHtml(job.salary)}</span>
        <button onclick="logAndApply('${job.id}')" class="btn-apply">Apply with Autofill</button>
      </div>
    </div>
  `;
}

function logAndApply(id) {
  // Open sandbox apply portal in new window/tab passing jobId
  window.open(`apply-sandbox.html?jobId=${id}`, "_blank");
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// Initial load
searchJobs();
</script>
</body>
</html>
