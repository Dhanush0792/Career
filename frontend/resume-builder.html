<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder - JobXApply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f3ff;
      --primary-glow: rgba(0, 243, 255, 0.15);
      --bg-dark: #0a0e17;
      --card-bg: rgba(16, 22, 35, 0.6);
      --border-color: rgba(0, 243, 255, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --white: #ffffff;
      --dim: #94a3b8;
      --glass-border: rgba(0, 243, 255, 0.2);
      --mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow: hidden; /* Prevent page scroll */
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 56px; /* Nav bar height */
      box-sizing: border-box;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.03) 0%, transparent 45%);
      background-attachment: fixed;
    }

    /* Shared Navigation Bar Styles */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(11, 16, 32, 0.85);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex; align-items: center;
    }
    .nav__inner {
      width: 100%; max-width: 1100px;
      margin: 0 auto; padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav__logo {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 13px; font-weight: 700;
      color: var(--white); text-decoration: none; letter-spacing: .04em;
    }
    .nav__logo-bracket { color: var(--primary); }
    .nav__links { display: flex; gap: 8px; }
    .nav__link {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim); text-decoration: none;
      padding: 6px 12px; border-radius: 6px;
      transition: color .2s, background .2s;
    }
    .nav__link:hover { color: var(--white); background: rgba(255, 255, 255, 0.04); }
    .nav__link--active { color: var(--primary) !important; }
    .nav__logout {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim); cursor: pointer;
      border: 1px solid var(--glass-border);
      padding: 6px 14px; border-radius: 8px;
      background: transparent;
      transition: color .2s, border-color .2s;
    }
    .nav__logout:hover { color: var(--primary); border-color: var(--primary); }

    #app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      padding: 6px 16px 6px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .builder-grid {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 14px;
      flex: 1;
      height: 100%;
      min-height: 0;
      align-items: stretch;
    }

    /* Zoom & Preview Controls */
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px 6px;
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .zoom-btn:hover { color: var(--primary); background: rgba(0,243,255,0.1); }
    .zoom-val {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--white);
      min-width: 38px;
      text-align: center;
    }

    /* Dropdown styles for actions menu */
    .dropdown-item {
      display: block;
      padding: 9px 14px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .dropdown-item:hover {
      background: rgba(0, 243, 255, 0.1);
      color: var(--primary);
    }

    /* Accordion Left Panel */
    .editor-col {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 4px;
    }
    .editor-col::-webkit-scrollbar { width: 4px; }
    .editor-col::-webkit-scrollbar-track { background: transparent; }
    .editor-col::-webkit-scrollbar-thumb { background: rgba(0,243,255,0.2); border-radius: 2px; }

    .accordion-section {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-bg);
      flex-shrink: 0;
    }
    .accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      cursor: pointer;
      user-select: none;
      background: rgba(0,243,255,0.03);
      transition: background 0.15s;
    }
    .accordion-header:hover { background: rgba(0,243,255,0.07); }
    .accordion-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
    }
    .accordion-chevron {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .accordion-section.open .accordion-chevron { transform: rotate(180deg); }
    .accordion-body {
      display: none;
      padding: 10px 14px 12px;
    }
    .accordion-section.open .accordion-body { display: block; }

    /* Compact inputs inside accordion */
    .cf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cf-full { grid-column: span 2; }
    .fg { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
    .fg label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .fg input, .fg select, .fg textarea {
      background: rgba(10,15,30,0.5);
      border: 1px solid rgba(0,243,255,0.15);
      border-radius: 5px;
      padding: 5px 8px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    .fg input:focus, .fg select:focus, .fg textarea:focus {
      border-color: var(--primary);
    }
    .fg textarea { resize: vertical; min-height: 52px; }
    .fg select option { background: #0a0e17; }

    /* Accordion add/remove buttons */
    .acc-add-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(0,243,255,0.06);
      border: 1px solid var(--border-color);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
    }
    .acc-add-btn:hover { background: rgba(0,243,255,0.12); }
    .acc-remove-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #ef4444;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
    }

    .exp-block, .edu-block {
      border: 1px solid rgba(0,243,255,0.1);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: rgba(0,0,0,0.2);
    }

    /* Preview Right Panel - full height, no overflow */
    .preview-col {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-col::-webkit-scrollbar {
      width: 6px;
    }
    .editor-col::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    .editor-col::-webkit-scrollbar-thumb {
      background: rgba(0, 243, 255, 0.2);
      border-radius: 3px;
    }
    .editor-col::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 243, 255, 0.4);
    }

    /* Editor Tabs Layout */
    .tabs-header { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; font-family: var(--mono); font-size: 11px; cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .editor-section {
      display: none;
    }
    .editor-section.active {
      display: block !important;
    }

    @media (max-width: 1200px) {
      .builder-grid {
        grid-template-columns: 1fr;
      }
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 16px;
    }

    .card-header {
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.1);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .col-6 {
      flex: 1;
    }

    label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .glass-input {
      background: rgba(10, 15, 30, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.15);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      width: 100%;
    }

    .glass-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    textarea.glass-input {
      resize: vertical;
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #020617;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-primary:hover {
      background: #00d2e0;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(0, 243, 255, 0.05);
      border-color: var(--border-color);
      color: var(--primary);
    }

    .btn-secondary:hover {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--primary);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    /* Experience & Education list styles */
    .experience-item, .education-item {
      border: 1px solid rgba(0, 243, 255, 0.1);
      background: rgba(10, 15, 30, 0.3);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .experience-item:hover, .education-item:hover {
      border-color: rgba(0, 243, 255, 0.25);
      background: rgba(10, 15, 30, 0.5);
    }

    /* Live Preview Pane */
    .sticky-preview {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-bottom: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      backdrop-filter: blur(10px);
    }

    .preview-container {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 0;
    }

    .preview-sheet {
      background: white;
      color: #000000;
      padding: 40px 48px;
      border-radius: 0;
      font-family: 'Times New Roman', Times, serif, 'Inter', sans-serif;
      width: 794px;
      height: 1123px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transform-origin: top center;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .preview-header {
      border-bottom: 1.5px solid #000000;
      padding-bottom: 8px;
      margin-bottom: 14px;
      text-align: center;
    }

    .preview-name {
      margin: 0;
      font-size: 1.7rem;
      color: #000000;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .preview-title {
      display: none;
    }

    .preview-contact {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #000000;
      margin-top: 4px;
    }

    .preview-section {
      margin-bottom: 14px;
    }

    .preview-section-title {
      font-size: 0.95rem;
      border-bottom: 1px solid #000000;
      padding-bottom: 2px;
      margin-bottom: 6px;
      color: #000000;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .preview-date {
      color: #64748b;
      font-size: 0.8rem;
    }

    .preview-summary {
      margin: 0 0 10px;
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .preview-skills {
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }

    /* Sync Loading Overlay Styles */
    .sync-loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 16, 32, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .sync-loading-card {
      background: #0B1020;
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      max-width: 320px;
      width: 100%;
    }
    .sync-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 243, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: sync-spin 1s linear infinite;
    }
    .sync-loading-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    @keyframes sync-spin {
      to { transform: rotate(360deg); }
    }
    @media print {
      /* Hide everything except the preview sheet */
      body, html, #app-container, .main-content, .builder-grid, .preview-col, .sticky-preview, .preview-container {
        background: white !important;
        color: black !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        width: 100% !important;
        overflow: visible !important;
        display: block !important;
        box-shadow: none !important;
        border: none !important;
        backdrop-filter: none !important;
      }
      
      /* Hide all UI elements */
      .nav, .header, .editor-col, .card-header, .preview-actions, .sync-loading-overlay, #scroll-progress {
        display: none !important;
      }

      /* Style the preview sheet for print */
      .preview-sheet {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        transform: scale(1) !important; /* Reset dynamic scaling */
        transform-origin: top left !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }

      @page {
        size: A4;
        margin: 20mm;
      }
    }
  </style>
</head>
<body>
  <nav class="nav" id="main-nav"></nav>
  <div id="app-container">
    <!-- Main Content -->
    <main class="main-content">


      <div id="resume-builder-app" class="builder-grid">
        <!-- Left: Compact Accordion Editor -->
        <div class="editor-col">

          <!-- 01 Basics -->
          <div class="accordion-section open" id="acc-basics">
            <div class="accordion-header" onclick="toggleAccordion('acc-basics')">
              <span class="accordion-title">01 // Basics</span>
              <span class="accordion-chevron">[ - ]</span>
            </div>
            <div class="accordion-body">
              <div class="cf">
                <div class="fg">
                  <label>Name *</label>
                  <input type="text" id="res-name" placeholder="John Doe">
                </div>
                <div class="fg">
                  <label>Target Role</label>
                  <select id="res-title" onchange="handleRoleSelection()">
                    <option value="">Select Role</option>
                    <option value="SDE">SDE (Software Dev)</option>
                    <option value="Junior Developer">Junior Developer</option>
                    <option value="Java/Python/C/C++ Developer">Java/Python/C++ Dev</option>
                    <option value="Content Manager">Content Manager</option>
                    <option value="Video Editor">Video Editor</option>
                    <option value="Senior Developer">Senior Developer</option>
                    <option value="Marketing Specialist">Marketing Specialist</option>
                    <option value="Customer Care Executive">Customer Care</option>
                    <option value="Business Executive">Business Executive</option>
                  </select>
                </div>
                <div class="fg">
                  <label>Experience Level</label>
                  <select id="res-experience-level" onchange="handleRoleSelection()">
                    <option value="Student">Student (Academic / Intern)</option>
                    <option value="Fresher" selected>Fresher (0-1 yrs)</option>
                    <option value="Experienced">Experienced (2+ yrs)</option>
                  </select>
                </div>
                <div class="fg">
                  <label>Email</label>
                  <input type="email" id="res-email" placeholder="you@email.com">
                </div>
                <div class="fg">
                  <label>Phone</label>
                  <input type="text" id="res-phone" placeholder="+91 98765 43210">
                </div>
                <div class="fg">
                  <label>Location</label>
                  <input type="text" id="res-location" placeholder="City, Country">
                </div>
                <div class="fg cf-full">
                  <label>Website / Portfolio</label>
                  <input type="text" id="res-website" placeholder="github.com/you">
                </div>
                <div class="fg cf-full">
                  <label>Professional Summary</label>
                  <textarea id="res-summary" placeholder="Brief summary..."></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- 02 Skills -->
          <div class="accordion-section" id="acc-skills">
            <div class="accordion-header" onclick="toggleAccordion('acc-skills')">
              <span class="accordion-title">02 // Skills</span>
              <span class="accordion-chevron">[ + ]</span>
            </div>
            <div class="accordion-body">
              <div class="fg">
                <label>Skills (comma separated)</label>
                <input type="text" id="res-skills" placeholder="JavaScript, Python, React...">
              </div>
            </div>
          </div>

          <!-- 03 Experience -->
          <div class="accordion-section" id="acc-experience">
            <div class="accordion-header" onclick="toggleAccordion('acc-experience')">
              <span class="accordion-title">03 // Experience</span>
              <span class="accordion-chevron">[ + ]</span>
            </div>
            <div class="accordion-body">
              <div id="experience-list"></div>
              <button class="acc-add-btn" onclick="addExperienceRow()">+ Add Position</button>
            </div>
          </div>

          <!-- 04 Education -->
          <div class="accordion-section" id="acc-education">
            <div class="accordion-header" onclick="toggleAccordion('acc-education')">
              <span class="accordion-title">04 // Education</span>
              <span class="accordion-chevron">[ + ]</span>
            </div>
            <div class="accordion-body">
              <div id="education-list"></div>
              <button class="acc-add-btn" onclick="addEducationRow()">+ Add Education</button>
            </div>
          </div>

          <!-- 05 Projects -->
          <div class="accordion-section" id="acc-projects">
            <div class="accordion-header" onclick="toggleAccordion('acc-projects')">
              <span class="accordion-title">05 // Projects</span>
              <span class="accordion-chevron">[ + ]</span>
            </div>
            <div class="accordion-body">
              <div id="projects-list"></div>
              <button class="acc-add-btn" onclick="addProjectRow()">+ Add Project</button>
            </div>
          </div>

          <!-- 06 Certifications -->
          <div class="accordion-section" id="acc-certs">
            <div class="accordion-header" onclick="toggleAccordion('acc-certs')">
              <span class="accordion-title">06 // Certifications</span>
              <span class="accordion-chevron">[ + ]</span>
            </div>
            <div class="accordion-body">
              <div class="fg">
                <label>Certifications (one per line or comma separated)</label>
                <textarea id="res-certs" placeholder="AWS Certified Solutions Architect&#10;Meta Frontend Developer Certificate"></textarea>
              </div>
            </div>
          </div>

          <!-- 07 Additional Information -->

    // Populate form with profile data
    function populateFromProfile(state) {
      if (!state) return;
      activeUserProfile = state.profile || {};

      // Populate Basics
      document.getElementById("res-name").value = profile.fullName || "";
      const titleVal = profile.headline || profile.targetRole || "";
      const titleEl = document.getElementById("res-title");
      if (titleEl && titleVal) {
        let exists = false;
        for (const opt of titleEl.options) {
          if (opt.value === titleVal) exists = true;
        }
        if (!exists && titleVal.trim()) {
          const newOpt = new Option(titleVal, titleVal, true, true);
          titleEl.add(newOpt);
        }
        titleEl.value = titleVal;
      }
      document.getElementById("res-email").value = profile.email || "";
      document.getElementById("res-phone").value = profile.phone || "";

    let userZoomScale = null; // null means auto fit

    function changeZoom(delta) {
      const container = document.querySelector('.preview-container');
      const sheet = document.getElementById('live-preview-sheet');
      if (!container || !sheet) return;

      const availH = container.clientHeight;
      const availW = container.clientWidth;
      const autoScale = Math.min(availH / 1123, availW / 794);

      let current = userZoomScale !== null ? userZoomScale : autoScale;
      current = Math.max(0.3, Math.min(2.0, current + delta));
      userZoomScale = current;

      applyZoom(userZoomScale, container, sheet);
    }

    function resetZoomToFit() {
      userZoomScale = null;
      fitPreview();
    }

    function applyZoom(scale, container, sheet) {
      const availW = container.clientWidth;
      const leftOffset = Math.max(0, (availW - 794 * scale) / 2);

      sheet.style.transformOrigin = 'top left';
      sheet.style.transform = `scale(${scale})`;
      sheet.style.marginLeft = `${leftOffset}px`;
      sheet.style.marginBottom = `${1123 * (scale - 1)}px`;
      sheet.style.marginTop = '0';
      sheet.style.marginRight = '0';

      const zoomDisplay = document.getElementById('zoom-display');
      if (zoomDisplay) {
        zoomDisplay.textContent = `${Math.round(scale * 100)}%`;
      }
    }

    // Auto-scale live preview sheet to fit viewport HEIGHT and WIDTH — full A4 always visible
    function fitPreview() {
      const container = document.querySelector('.preview-container');
      const sheet = document.getElementById('live-preview-sheet');
      if (!container || !sheet) return;

      const availH = container.clientHeight;
      const availW = container.clientWidth;
      if (!availH || !availW) return;

      if (userZoomScale !== null) {
        applyZoom(userZoomScale, container, sheet);
        return;
      }

      const scaleH = availH / 1123;
      const scaleW = availW / 794;
      const scale = Math.min(scaleH, scaleW);

      applyZoom(scale, container, sheet);
    }

    // Observe container resize smoothly
    const previewContainerEl = document.querySelector('.preview-container');
    if (previewContainerEl && window.ResizeObserver) {
      new ResizeObserver(() => {
        fitPreview();
      }).observe(previewContainerEl);
    }

    window.addEventListener('resize', fitPreview);

    // Export PDF or JSON functions
    function exportPDF() {
      // Print preview sheet
      window.print();
    }

    // JSON export
    function exportJSON() {
      const data = {
        basics: {
          name: document.getElementById("res-name")?.value || "",
          title: document.getElementById("res-title")?.value || "",
          email: document.getElementById("res-email")?.value || "",
          phone: document.getElementById("res-phone")?.value || "",
          location: document.getElementById("res-location")?.value || "",
          website: document.getElementById("res-website")?.value || "",
          summary: document.getElementById("res-summary")?.value || "",
        },
        skills: (document.getElementById("res-skills")?.value || "").split(",").map(s => s.trim()).filter(Boolean),
        experience: Array.from(document.querySelectorAll(".experience-item")).map(item => {
          const inputs = item.querySelectorAll("input, textarea");
          return {
            company: inputs[0]?.value || "",
            position: inputs[1]?.value || "",
            startDate: inputs[2]?.value || "",
            endDate: inputs[3]?.value || "",
            summary: inputs[4]?.value || ""
          };
        }),
        education: Array.from(document.querySelectorAll(".education-item")).map(item => {
          const inputs = item.querySelectorAll("input");
          return {
            institution: inputs[0]?.value || "",
            area: inputs[1]?.value || "",
            year: inputs[2]?.value || ""
          };
        })
      };
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "resume.json";
      a.click();
    }

    // Generate High ATS FAANG-Standard LaTeX Code
    // Format Order: 1. Header -> 2. Summary -> 3. Education -> 4. Experience -> 5. Skills -> 6. Projects -> 7. Certifications -> 8. Additional Information
    function generateLatexCode() {
      const name = document.getElementById("res-name")?.value.trim() || "Candidate Name";
      const title = document.getElementById("res-title")?.value.trim() || "";
      const email = document.getElementById("res-email")?.value.trim() || "";
      const phone = document.getElementById("res-phone")?.value.trim() || "";
      const location = document.getElementById("res-location")?.value.trim() || "";
      const website = document.getElementById("res-website")?.value.trim() || "";
      const summary = document.getElementById("res-summary")?.value.trim() || "";
      const skills = (document.getElementById("res-skills")?.value || "").split(",").map(s => s.trim()).filter(Boolean);

      const escapeLatex = (str) => {
        if (!str) return "";
        return String(str)
          .replace(/[\u2600-\u27BF]|[\u{1F300}-\u{1FAFF}]/gu, "")
          .replace(/\\/g, "\\textbackslash{}")
          .replace(/([&%$#_{}])/g, "\\$1")
          .replace(/\^/g, "\\textasciicircum{}")
          .replace(/~/g, "\\textasciitilde{}")
          .replace(/</g, "\\textless{}")
          .replace(/>/g, "\\textgreater{}")
          .replace(/\n/g, " ");
      };

      let contactItems = [];
      if (email) contactItems.push(`\\href{mailto:${email}}{${escapeLatex(email)}}`);
      if (phone) contactItems.push(escapeLatex(phone));
      if (location) contactItems.push(escapeLatex(location));
      if (website) contactItems.push(`\\href{https://${website.replace(/^https?:\/\//, '')}}{${escapeLatex(website)}}`);

      // 2. Education
      let eduTex = "";
      document.querySelectorAll(".education-item").forEach(item => {
        const inputs = item.querySelectorAll("input");
        const inst = inputs[0]?.value.trim() || "";
        const area = inputs[1]?.value.trim() || "";
        const year = inputs[2]?.value.trim() || "";

        if (inst || area) {
          eduTex += `\\noindent\\textbf{${escapeLatex(area)}} \\hfill ${escapeLatex(year)}\\\\\n`;
          eduTex += `\\textit{${escapeLatex(inst)}}\\\\[4pt]\n\n`;
        }
      });

      // 3. Experience
      let expTex = "";
      document.querySelectorAll(".experience-item").forEach(item => {
        const inputs = item.querySelectorAll("input, textarea");
        const company = inputs[0]?.value.trim() || "";
        const position = inputs[1]?.value.trim() || "";
        const startDate = inputs[2]?.value.trim() || "";
        const endDate = inputs[3]?.value.trim() || "";
        const expSummary = inputs[4]?.value.trim() || "";

        if (company || position) {
          expTex += `\\noindent\\textbf{${escapeLatex(position)}} \\hfill ${escapeLatex(startDate)} -- ${escapeLatex(endDate)}\\\\\n`;
          expTex += `\\textit{${escapeLatex(company)}}\n`;
          if (expSummary) {
            const bullets = expSummary.split('\n').map(b => b.trim()).filter(Boolean);
            if (bullets.length > 0) {
              expTex += `\\begin{itemize}[leftmargin=0.18in, topsep=2pt, itemsep=2pt]\n`;
              bullets.forEach(b => {
                const cleanB = b.replace(/^[-*•]\s*/, '');
                expTex += `  \\item ${escapeLatex(cleanB)}\n`;
              });
              expTex += `\\end{itemize}\n`;
            }
          }
          expTex += `\\vspace{4pt}\n\n`;
        }
      });

      // 4. Skills
      let skillsTex = "";
      if (skills.length > 0) {
        skillsTex = `\\begin{itemize}[leftmargin=0.18in, topsep=2pt, itemsep=2pt]\n  \\item \\textbf{Core Competencies:} ${escapeLatex(skills.join(', '))}\n\\end{itemize}\n\\vspace{4pt}\n`;
      }

      // 5. Projects
      let projTex = "";
      document.querySelectorAll(".project-item").forEach(item => {
        const inputs = item.querySelectorAll("input, textarea");
        const pName = inputs[0]?.value.trim() || "";
        const pTech = inputs[1]?.value.trim() || "";
        const pSum = inputs[2]?.value.trim() || "";

        if (pName) {
          projTex += `\\noindent\\textbf{${escapeLatex(pName)}} ${pTech ? `\\textit{| ${escapeLatex(pTech)}}` : ''}\\\\\n`;
          if (pSum) {
            const bullets = pSum.split('\n').map(b => b.trim()).filter(Boolean);
            if (bullets.length > 0) {
              projTex += `\\begin{itemize}[leftmargin=0.18in, topsep=2pt, itemsep=2pt]\n`;
              bullets.forEach(b => {
                const cleanB = b.replace(/^[-*•]\s*/, '');
                projTex += `  \\item ${escapeLatex(cleanB)}\n`;
              });
              projTex += `\\end{itemize}\n`;
            }
          }
          projTex += `\\vspace{4pt}\n\n`;
        }
      });

      // 6. Certifications
      const certsVal = document.getElementById("res-certs")?.value.trim() || "";
      let certsTex = "";
      if (certsVal) {
        const certList = certsVal.split('\n').map(c => c.trim()).filter(Boolean);
        if (certList.length > 0) {
          certsTex += `\\begin{itemize}[leftmargin=0.18in, topsep=2pt, itemsep=2pt]\n`;
          certList.forEach(c => {
            certsTex += `  \\item ${escapeLatex(c.replace(/^[-*•]\s*/, ''))}\n`;
          });
          certsTex += `\\end{itemize}\n\\vspace{4pt}\n`;
        }
      }

      // 7. Additional Information
      const langVal = document.getElementById("res-languages")?.value.trim() || "";
      const relocVal = document.getElementById("res-relocation")?.value.trim() || "";
      const interestVal = document.getElementById("res-interests")?.value.trim() || "";
      let addTex = "";
      let addItems = [];
      if (langVal) addItems.push(`\\textbf{Languages:} ${escapeLatex(langVal)}`);
      if (relocVal) addItems.push(`\\textbf{Availability \\& Location Preference:} ${escapeLatex(relocVal)}`);
      if (interestVal) addItems.push(`\\textbf{Key Highlights:} ${escapeLatex(interestVal)}`);

      if (addItems.length > 0) {
        addTex = `\\begin{itemize}[leftmargin=0.18in, topsep=2pt, itemsep=2pt]\n`;
        addItems.forEach(ai => {
          addTex += `  \\item ${ai}\n`;
        });
        addTex += `\\end{itemize}\n\\vspace{4pt}\n`;
      }

      const latex = `\\documentclass[a4paper,10pt]{article}
\\usepackage[a4paper,margin=0.6in]{geometry}
\\usepackage[T1]{fontenc}
\\usepackage{titlesec}
\\usepackage{enumitem}
\\usepackage{hyperref}
\\usepackage{tabularx}
\\setlength{\\parindent}{0pt}
\\pagestyle{empty}

% High ATS FAANG Standard - Strict Single Black Color, Zero Emojis
\\hypersetup{
    colorlinks=true,
    linkcolor=black,
    filecolor=black,
    urlcolor=black,
    citecolor=black
}

\\titleformat{\\section}{\\large\\bfseries\\uppercase}{}{0em}{}[\\titlerule]
\\titlespacing*{\\section}{0pt}{8pt}{4pt}

\\begin{document}

\\begin{center}
  {\\LARGE\\bfseries ${escapeLatex(name)}}\\\\[2pt]
  ${title ? `{\\large\\bfseries ${escapeLatex(title)}}\\\\[3pt]` : ''}
  {\\small ${contactItems.join(' \\,$\\cdot$\\, ')}}
\\end{center}
\\vspace{2pt}

${summary ? `\\section*{Summary}
${escapeLatex(summary)}
\\vspace{4pt}
` : ''}
${eduTex ? `\\section*{Education}
${eduTex}` : ''}
${expTex ? `\\section*{Experience}
${expTex}` : ''}
${skillsTex ? `\\section*{Skills}
${skillsTex}` : ''}
${projTex ? `\\section*{Projects}
${projTex}` : ''}
${certsTex ? `\\section*{Certifications}
${certsTex}` : ''}
${addTex ? `\\section*{Additional Information}
${addTex}` : ''}
\\end{document}`;

      return latex;
    }

    function copyLatexCode() {
      const code = generateLatexCode();
      navigator.clipboard.writeText(code).then(() => {
        alert("FAANG-Standard Resume LaTeX source code copied to clipboard (100% ATS Single Black Color format).");
      });
    }

    function downloadLatexFile() {
      const code = generateLatexCode();
      const blob = new Blob([code], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "resume.tex";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
