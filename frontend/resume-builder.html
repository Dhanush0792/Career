<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder - JobXApply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f3ff;
      --primary-glow: rgba(0, 243, 255, 0.15);
      --bg-dark: #0a0e17;
      --card-bg: rgba(16, 22, 35, 0.6);
      --border-color: rgba(0, 243, 255, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --white: #ffffff;
      --dim: #94a3b8;
      --glass-border: rgba(0, 243, 255, 0.2);
      --mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow: hidden; /* Prevent page scroll */
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 56px; /* Nav bar height */
      box-sizing: border-box;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.03) 0%, transparent 45%);
      background-attachment: fixed;
    }

    /* Shared Navigation Bar Styles */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(11, 16, 32, 0.85);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex; align-items: center;
    }
    .nav__inner {
      width: 100%; max-width: 1100px;
      margin: 0 auto; padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav__logo {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 13px; font-weight: 700;
      color: var(--white); text-decoration: none; letter-spacing: .04em;
    }
    .nav__logo-bracket { color: var(--primary); }
    .nav__links { display: flex; gap: 8px; }
    .nav__link {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim); text-decoration: none;
      padding: 6px 12px; border-radius: 6px;
      transition: color .2s, background .2s;
    }
    .nav__link:hover { color: var(--white); background: rgba(255, 255, 255, 0.04); }
    .nav__link--active { color: var(--primary) !important; }
    .nav__logout {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim); cursor: pointer;
      border: 1px solid var(--glass-border);
      padding: 6px 14px; border-radius: 8px;
      background: transparent;
      transition: color .2s, border-color .2s;
    }
    .nav__logout:hover { color: var(--primary); border-color: var(--primary); }

    #app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      padding: 20px 40px;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .builder-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      flex: 1;
      height: calc(100% - 60px);
      min-height: 0;
      align-items: stretch;
    }

    .editor-col {
      height: 100%;
      overflow-y: auto;
      padding-right: 12px;
    }
    .editor-col::-webkit-scrollbar {
      width: 6px;
    }
    .editor-col::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    .editor-col::-webkit-scrollbar-thumb {
      background: rgba(0, 243, 255, 0.2);
      border-radius: 3px;
    }
    .editor-col::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 243, 255, 0.4);
    }

    /* Editor Tabs Layout */
    .tabs-header { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; font-family: var(--mono); font-size: 11px; cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .editor-section {
      display: none;
    }
    .editor-section.active {
      display: block !important;
    }

    @media (max-width: 1200px) {
      .builder-grid {
        grid-template-columns: 1fr;
      }
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 16px;
    }

    .card-header {
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.1);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .col-6 {
      flex: 1;
    }

    label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .glass-input {
      background: rgba(10, 15, 30, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.15);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      width: 100%;
    }

    .glass-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    textarea.glass-input {
      resize: vertical;
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #020617;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-primary:hover {
      background: #00d2e0;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(0, 243, 255, 0.05);
      border-color: var(--border-color);
      color: var(--primary);
    }

    .btn-secondary:hover {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--primary);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    /* Experience & Education list styles */
    .experience-item, .education-item {
      border: 1px solid rgba(0, 243, 255, 0.1);
      background: rgba(10, 15, 30, 0.3);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .experience-item:hover, .education-item:hover {
      border-color: rgba(0, 243, 255, 0.25);
      background: rgba(10, 15, 30, 0.5);
    }

    /* Live Preview Pane */
    .sticky-preview {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-bottom: 0;
    }

    .preview-container {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 10px;
      margin-top: 10px;
    }

    .preview-sheet {
      background: white;
      color: #1e293b;
      padding: 35px;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      width: 794px;
      height: 1123px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transform-origin: top center;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .preview-header {
      border-bottom: 2px solid #00f3ff;
      padding-bottom: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .preview-name {
      margin: 0;
      font-size: 1.8rem;
      color: #0f172a;
      font-weight: 700;
    }

    .preview-title {
      margin: 4px 0 8px;
      font-size: 1.1rem;
      color: #00bcd4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preview-contact {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #64748b;
    }

    .preview-section {
      margin-bottom: 18px;
    }

    .preview-section-title {
      font-size: 1rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
      margin-bottom: 8px;
      color: #0f172a;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .preview-date {
      color: #64748b;
      font-size: 0.8rem;
    }

    .preview-summary {
      margin: 0 0 10px;
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .preview-skills {
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }

    /* Sync Loading Overlay Styles */
    .sync-loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 16, 32, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .sync-loading-card {
      background: #0B1020;
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      max-width: 320px;
      width: 100%;
    }
    .sync-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 243, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: sync-spin 1s linear infinite;
    }
    .sync-loading-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    @keyframes sync-spin {
      to { transform: rotate(360deg); }
    }
    @media print {
      /* Hide everything except the preview sheet */
      body, html, #app-container, .main-content, .builder-grid, .preview-col, .sticky-preview, .preview-container {
        background: white !important;
        color: black !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        width: 100% !important;
        overflow: visible !important;
        display: block !important;
        box-shadow: none !important;
        border: none !important;
        backdrop-filter: none !important;
      }
      
      /* Hide all UI elements */
      .nav, .header, .editor-col, .card-header, .preview-actions, .sync-loading-overlay, #scroll-progress {
        display: none !important;
      }

      /* Style the preview sheet for print */
      .preview-sheet {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        transform: scale(1) !important; /* Reset dynamic scaling */
        transform-origin: top left !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }

      @page {
        size: A4;
        margin: 20mm;
      }
    }
  </style>
</head>
<body>
  <nav class="nav" id="main-nav"></nav>
  <div id="app-container">
    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1 class="page-title">Resume Builder</h1>
        <div class="preview-actions">
          <button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button>
          <button class="btn btn-primary" onclick="exportPDF()">Export PDF</button>
        </div>
      </header>

      <div id="resume-builder-app" class="builder-grid">
        <!-- Editor Column -->
        <div class="editor-col">
          <!-- Editor Sub-Tabs -->
          <div class="tabs-header">
            <button class="tab-btn active" onclick="switchEditorTab('tab-personal', this)">01 // BASICS</button>
            <button class="tab-btn" onclick="switchEditorTab('tab-skills', this)">02 // SKILLS</button>
            <button class="tab-btn" onclick="switchEditorTab('tab-experience', this)">03 // EXPERIENCE</button>
            <button class="tab-btn" onclick="switchEditorTab('tab-education', this)">04 // EDUCATION</button>
          </div>

          <!-- Personal Info -->
          <div class="glass-card editor-section active" id="tab-personal">
            <div class="card-header">
              <h3 class="card-title">01 // Personal Info</h3>
            </div>
            <div class="card-body">
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="res-name">Name *</label>
                  <input type="text" id="res-name" class="glass-input" placeholder="e.g. John Doe">
                </div>
                <div class="form-group col-6">
                  <label for="res-title">Target Job Title</label>
                  <select id="res-title" class="glass-input" onchange="handleRoleSelection()">
                    <option value="">Select Target Role</option>
                    <option value="SDE">SDE</option>
                    <option value="Junior Developer">Junior Developer</option>
                    <option value="Java/Python/C/C++ Developer">Java/Python/C/C++ Developer</option>
                    <option value="Content Manager">Content Manager</option>
                    <option value="Video Editor">Video Editor</option>
                    <option value="Senior Developer">Senior Developer</option>
                    <option value="Marketing Specialist">Marketing Specialist</option>
                    <option value="Customer Care Executive">Customer Care Executive</option>
                    <option value="Business Executive">Business Executive</option>
                  </select>
                </div>
              </div>
              <div class="form-row" style="margin-top: 15px;">
                <div class="form-group col-6">
                  <label for="res-email">Email Address</label>
                  <input type="email" id="res-email" class="glass-input" placeholder="e.g. john@example.com">
                </div>
                <div class="form-group col-6">
                  <label for="res-phone">Phone Number</label>
                  <input type="text" id="res-phone" class="glass-input" placeholder="e.g. +1 555-0199">
                </div>
              </div>
              <div class="form-row" style="margin-top: 15px;">
                <div class="form-group col-6">
                  <label for="res-location">Location</label>
                  <input type="text" id="res-location" class="glass-input" placeholder="e.g. San Francisco, CA">
                </div>
                <div class="form-group col-6">
                  <label for="res-website">Website / Portfolio</label>
                  <input type="text" id="res-website" class="glass-input" placeholder="e.g. github.com/johndoe">
                </div>
              </div>
              <div class="form-group" style="margin-top: 15px;">
                <label for="res-summary">Professional Summary</label>
                <textarea id="res-summary" class="glass-input" rows="4" placeholder="Brief summary of your professional background..."></textarea>
              </div>
            </div>
          </div>

          <!-- Skills -->
          <div class="glass-card editor-section" id="tab-skills">
            <div class="card-header">
              <h3 class="card-title">02 // Skills</h3>
            </div>
            <div class="card-body">
              <div class="form-group">
                <label for="res-skills">Technical & Soft Skills (comma separated)</label>
                <input type="text" id="res-skills" class="glass-input" placeholder="e.g. JavaScript, Python, React, Project Management">
              </div>
            </div>
          </div>

          <!-- Experience -->
          <div class="glass-card editor-section" id="tab-experience">
            <div class="card-header">
              <h3 class="card-title">03 // Work Experience</h3>
              <button class="btn btn-secondary btn-sm" onclick="addExperienceRow()">+ Add Position</button>
            </div>
            <div class="card-body" id="experience-list">
              <!-- Dynamically added rows -->
            </div>
          </div>

          <!-- Education -->
          <div class="glass-card editor-section" id="tab-education">
            <div class="card-header">
              <h3 class="card-title">04 // Education</h3>
              <button class="btn btn-secondary btn-sm" onclick="addEducationRow()">+ Add Education</button>
            </div>
            <div class="card-body" id="education-list">
              <!-- Dynamically added rows -->
            </div>
          </div>
        </div>

        <!-- Preview Column -->
        <div class="preview-col">
          <div class="glass-card sticky-preview">
            <div class="card-header">
              <h3 class="card-title">Live Resume Preview</h3>
            </div>
            <div class="preview-container">
              <div id="live-preview-sheet" class="preview-sheet">
                <!-- Live Preview gets rendered here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="shared-shell.js"></script>
  <script>
    if (typeof requireAuth === "function") {
      requireAuth();
    }

    window.switchEditorTab = function(tabId, btn) {
      document.querySelectorAll(".editor-section").forEach(sec => sec.classList.remove("active"));
      const target = document.getElementById(tabId);
      if (target) target.classList.add("active");
      
      document.querySelectorAll(".tabs-header .tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
    };

    document.addEventListener("DOMContentLoaded", async () => {
      // Render navigation
      const mainNav = document.getElementById('main-nav');
      if (mainNav && typeof renderNav === "function") {
        renderNav(mainNav, 'resume-builder.html');
      }
      
      const container = document.getElementById("resume-builder-app");
      if (!container) return;
      
      // Check loading overlay
      const overlay = document.createElement("div");
      overlay.className = "sync-loading-overlay";
      overlay.innerHTML = `
        <div class="sync-loading-card">
          <div class="sync-spinner"></div>
          <div class="sync-loading-text">Accessing Sync Vault...</div>
        </div>
      `;
      document.body.appendChild(overlay);
      
      // Load profile data (centralized sync)
      try {
        const state = await window.CareerBridgeSync.loadProfile();
        populateFromProfile(state);
      } catch (e) {
        console.error("Failed to load profile:", e);
      } finally {
        overlay.remove();
        setTimeout(fitPreview, 50); // Small timeout to ensure DOM is drawn
      }

      // Add input event listener to all editor inputs to update preview dynamically
      document.addEventListener("input", updatePreview);
    });

    let activeUserProfile = {};

    const ROLE_SUMMARIES = {
      "SDE": {
        "Student": "Computer Science student passionate about software engineering, algorithms, and clean code.",
        "Fresher": "Graduate seeking an entry-level SDE role to design and build scalable codebases.",
        "Experienced": "Experienced Software Engineer specializing in scalable microservices, backend systems, and architectural design."
      },
      "Junior Developer": {
        "Student": "Student coder seeking to apply programming skills in web and mobile app development.",
        "Fresher": "Passionate programmer looking to contribute to shipping features in a collaborative dev team.",
        "Experienced": "Junior developer with hands-on experience in frontend/backend tech stacks and API integrations."
      },
      "Java/Python/C/C++ Developer": {
        "Student": "Tech student focusing on systems programming, language design, and scripting automation.",
        "Fresher": "Graduate proficient in object-oriented programming, data models, and database scripting.",
        "Experienced": "Software Engineer specializing in enterprise application development, concurrency, and performance tuning."
      },
      "Content Manager": {
        "Student": "Communications student focused on digital media, search engine optimization, and copy writing.",
        "Fresher": "Creative graduate seeking to coordinate publishing, media campaigns, and brand storytelling.",
        "Experienced": "Senior Content Manager with experience designing enterprise content workflows and driving digital engagement."
      },
      "Video Editor": {
        "Student": "Film/media student skilled in Adobe Premiere, motion graphics, and video production.",
        "Fresher": "Creative editor looking to produce high-impact short-form videos and marketing clips.",
        "Experienced": "Experienced Video Editor with a portfolio of commercial ads, post-production pipelines, and color grading."
      },
      "Senior Developer": {
        "Student": "Master's student skilled in system design, research prototyping, and infrastructure.",
        "Fresher": "Talented developer seeking to lead development cycles and build high-performance products.",
        "Experienced": "Senior Developer/Architect with history of managing software teams, cloud migrations, and system design."
      },
      "Marketing Specialist": {
        "Student": "Business student specializing in market analytics, growth hacking, and social campaigns.",
        "Fresher": "Marketing graduate eager to execute digital campaigns, email sequences, and lead generation.",
        "Experienced": "Results-driven Marketer with a track record of driving conversions, search engine visibility, and brand growth."
      },
      "Customer Care Executive": {
        "Student": "Student with strong active listening skills seeking to support customer service tasks.",
        "Fresher": "Empathetic graduate eager to troubleshoot user inquiries, handle tickets, and build retention.",
        "Experienced": "Support Lead experienced in customer success, escalations management, and CRM tool workflows."
      },
      "Business Executive": {
        "Student": "Management student focused on corporate strategy, operational planning, and sales.",
        "Fresher": "Energetic graduate looking to optimize business operations, sales pipelines, and key relationships.",
        "Experienced": "Business Operations Lead skilled in cross-functional coordination, sales strategies, and revenue growth."
      }
    };

    function handleRoleSelection() {
      const role = document.getElementById("res-title").value;
      if (!role) return;
      
      const status = activeUserProfile.employmentStatus || "Fresher";
      const summaries = ROLE_SUMMARIES[role];
      if (summaries) {
        const summary = summaries[status] || summaries["Fresher"];
        document.getElementById("res-summary").value = summary;
        updatePreview();
      }
    }

    // Populate form with profile data
    function populateFromProfile(state) {
      if (!state) return;
      activeUserProfile = state.profile || {};
      const profile = activeUserProfile;
      
      // Populate Basics
      document.getElementById("res-name").value = profile.fullName || "";
      const titleVal = profile.headline || profile.targetRole || "";
      const titleEl = document.getElementById("res-title");
      if (titleEl && titleVal) {
        let exists = false;
        for (const opt of titleEl.options) {
          if (opt.value === titleVal) exists = true;
        }
        if (!exists && titleVal.trim()) {
          const newOpt = new Option(titleVal, titleVal, true, true);
          titleEl.add(newOpt);
        }
        titleEl.value = titleVal;
      }
      document.getElementById("res-email").value = profile.email || "";
      document.getElementById("res-phone").value = profile.phone || "";
      document.getElementById("res-location").value = (profile.city && profile.country) ? `${profile.city}, ${profile.country}` : (profile.city || profile.country || "");
      document.getElementById("res-website").value = profile.portfolio || "";
      document.getElementById("res-summary").value = profile.summary || "";
      
      // Populate Skills
      const skills = profile.skills || "";
      document.getElementById("res-skills").value = typeof skills === "string" ? skills : (Array.isArray(skills) ? skills.join(", ") : "");
      
      // Populate Experience
      const experience = profile.experience;
      const expContainer = document.getElementById("experience-list");
      if (expContainer) {
        expContainer.innerHTML = "";
        if (Array.isArray(experience)) {
          experience.forEach(exp => {
            addExperienceRow(exp);
          });
        } else if (typeof experience === "string" && experience.trim()) {
          addExperienceRow({ summary: experience });
        }
      }
      
      // Populate Education
      const education = profile.education;
      const eduContainer = document.getElementById("education-list");
      if (eduContainer) {
        eduContainer.innerHTML = "";
        if (Array.isArray(education)) {
          education.forEach(edu => {
            addEducationRow(edu);
          });
        } else if (typeof education === "string" && education.trim()) {
          addEducationRow({ area: education });
        }
      }

      // Initial preview render
      updatePreview();
    }

    // Interactive functions for adding rows
    function addExperienceRow(data = {}) {
      const list = document.getElementById("experience-list");
      if (!list) return;
      
      const row = document.createElement("div");
      row.className = "experience-item";
      row.innerHTML = `
        <div style="display: flex; justify-content: space-between; gap: 15px; margin-bottom: 12px;">
          <input type="text" placeholder="Company Name" value="${data.company || ''}" style="width: 50%;" class="glass-input">
          <input type="text" placeholder="Job Title" value="${data.position || ''}" style="width: 50%;" class="glass-input">
        </div>
        <div style="display: flex; justify-content: space-between; gap: 15px; margin-bottom: 12px;">
          <input type="text" placeholder="Start Date (e.g., Jun 2022)" value="${data.startDate || ''}" style="width: 50%;" class="glass-input">
          <input type="text" placeholder="End Date (e.g., Present)" value="${data.endDate || ''}" style="width: 50%;" class="glass-input">
        </div>
        <textarea placeholder="Key accomplishments and duties..." rows="3" style="width: 100%; margin-bottom: 10px;" class="glass-input">${data.summary || ''}</textarea>
        <button class="btn btn-secondary delete-btn btn-sm" onclick="this.parentElement.remove(); updatePreview();" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #ef4444;">Remove</button>
      `;
      list.appendChild(row);
      updatePreview();
    }

    // Dynamic row addition for education
    function addEducationRow(data = {}) {
      const list = document.getElementById("education-list");
      if (!list) return;
      
      const row = document.createElement("div");
      row.className = "education-item";
      row.innerHTML = `
        <div style="display: flex; justify-content: space-between; gap: 15px; margin-bottom: 12px;">
          <input type="text" placeholder="Institution" value="${data.institution || ''}" style="width: 50%;" class="glass-input">
          <input type="text" placeholder="Degree / Area of Study" value="${data.area || ''}" style="width: 50%;" class="glass-input">
        </div>
        <div style="display: flex; justify-content: space-between; gap: 15px; margin-bottom: 12px;">
          <input type="text" placeholder="Graduation Year" value="${data.year || ''}" style="width: 50%;" class="glass-input">
        </div>
        <button class="btn btn-secondary delete-btn btn-sm" onclick="this.parentElement.remove(); updatePreview();" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #ef4444;">Remove</button>
      `;
      list.appendChild(row);
      updatePreview();
    }

    // Update the live preview sheet
    function updatePreview() {
      const name = document.getElementById("res-name")?.value || "Your Name";
      const title = document.getElementById("res-title")?.value || "Target Job Title";
      const email = document.getElementById("res-email")?.value || "";
      const phone = document.getElementById("res-phone")?.value || "";
      const location = document.getElementById("res-location")?.value || "";
      const website = document.getElementById("res-website")?.value || "";
      const summary = document.getElementById("res-summary")?.value || "";
      
      const skillsInput = document.getElementById("res-skills")?.value || "";
      const skills = skillsInput.split(",").map(s => s.trim()).filter(Boolean);

      let expHtml = "";
      document.querySelectorAll(".experience-item").forEach(item => {
        const inputs = item.querySelectorAll("input, textarea");
        const company = inputs[0]?.value || "";
        const position = inputs[1]?.value || "";
        const startDate = inputs[2]?.value || "";
        const endDate = inputs[3]?.value || "";
        const expSummary = inputs[4]?.value || "";
        if (company || position) {
          expHtml += `
            <div style="margin-bottom: 12px;">
              <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; color: #0f172a;">
                <span>${position} @ ${company}</span>
                <span style="font-weight: 400; color: #64748b; font-size: 0.8rem;">${startDate} - ${endDate}</span>
              </div>
              <p style="font-size: 0.85rem; color: #334155; margin-top: 4px; line-height: 1.4; white-space: pre-line;">${expSummary}</p>
            </div>
          `;
        }
      });

      let eduHtml = "";
      document.querySelectorAll(".education-item").forEach(item => {
        const inputs = item.querySelectorAll("input");
        const inst = inputs[0]?.value || "";
        const area = inputs[1]?.value || "";
        const year = inputs[2]?.value || "";
        if (inst || area) {
          eduHtml += `
            <div style="margin-bottom: 8px;">
              <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; color: #0f172a;">
                <span>${area}</span>
                <span style="font-weight: 400; color: #64748b; font-size: 0.8rem;">Graduated: ${year}</span>
              </div>
              <div style="font-size: 0.85rem; color: #475569;">${inst}</div>
            </div>
          `;
        }
      });

      const sheet = document.getElementById("live-preview-sheet");
      if (!sheet) return;

      sheet.innerHTML = `
        <div class="preview-header">
          <h1 class="preview-name">${name}</h1>
          <h2 class="preview-title">${title}</h2>
          <div class="preview-contact">
            ${email ? `<span>✉ ${email}</span>` : ""}
            ${phone ? `<span>📞 ${phone}</span>` : ""}
            ${location ? `<span>📍 ${location}</span>` : ""}
            ${website ? `<span>🌐 ${website}</span>` : ""}
          </div>
        </div>
        
        ${summary ? `
          <div class="preview-section">
            <h3 class="preview-section-title">Professional Summary</h3>
            <p style="font-size: 0.85rem; color: #334155; line-height: 1.4; white-space: pre-line;">${summary}</p>
          </div>
        ` : ""}

        ${skills.length > 0 ? `
          <div class="preview-section">
            <h3 class="preview-section-title">Skills</h3>
            <p class="preview-skills">${skills.join(" • ")}</p>
          </div>
        ` : ""}

        ${expHtml ? `
          <div class="preview-section">
            <h3 class="preview-section-title">Professional Experience</h3>
            ${expHtml}
          </div>
        ` : ""}

        ${eduHtml ? `
          <div class="preview-section">
            <h3 class="preview-section-title">Education</h3>
            ${eduHtml}
          </div>
        ` : ""}
      `;
      fitPreview();
    }

    // Auto-scale live preview sheet to fit viewport
    function fitPreview() {
      const container = document.querySelector('.preview-container');
      const sheet = document.getElementById('live-preview-sheet');
      if (!container || !sheet) return;
      
      // Reset scale before computing dimensions
      sheet.style.transform = 'scale(1)';
      sheet.style.marginBottom = '0px';
      sheet.style.marginLeft = '0px';
      sheet.style.marginRight = '0px';

      const containerWidth = container.clientWidth - 20;
      const containerHeight = container.clientHeight - 20;
      
      const scaleX = containerWidth / 794;
      const scaleY = containerHeight / 1123;
      const scale = Math.min(scaleX, scaleY);
      
      sheet.style.transform = `scale(${scale})`;
      // Compensate space footprint left by scaled element
      sheet.style.marginBottom = `${1123 * (scale - 1)}px`;
      sheet.style.marginRight = `${(794 * (scale - 1)) / 2}px`;
      sheet.style.marginLeft = `${(794 * (scale - 1)) / 2}px`;
    }

    window.addEventListener('resize', fitPreview);

    // Export PDF or JSON functions
    function exportPDF() {
      // Print preview sheet
      window.print();
    }

    // JSON export
    function exportJSON() {
      const data = {
        basics: {
          name: document.getElementById("res-name")?.value || "",
          title: document.getElementById("res-title")?.value || "",
          email: document.getElementById("res-email")?.value || "",
          phone: document.getElementById("res-phone")?.value || "",
          location: document.getElementById("res-location")?.value || "",
          website: document.getElementById("res-website")?.value || "",
          summary: document.getElementById("res-summary")?.value || "",
        },
        skills: (document.getElementById("res-skills")?.value || "").split(",").map(s => s.trim()).filter(Boolean),
        experience: Array.from(document.querySelectorAll(".experience-item")).map(item => {
          const inputs = item.querySelectorAll("input, textarea");
          return {
            company: inputs[0]?.value || "",
            position: inputs[1]?.value || "",
            startDate: inputs[2]?.value || "",
            endDate: inputs[3]?.value || "",
            summary: inputs[4]?.value || ""
          };
        }),
        education: Array.from(document.querySelectorAll(".education-item")).map(item => {
          const inputs = item.querySelectorAll("input");
          return {
            institution: inputs[0]?.value || "",
            area: inputs[1]?.value || "",
            year: inputs[2]?.value || ""
          };
        })
      };
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "resume.json";
      a.click();
    }
  </script>
</body>
